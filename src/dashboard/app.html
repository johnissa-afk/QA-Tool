<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Website QA</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1d2130; --fg: #e6e9f0; --muted: #98a1b3;
    --accent: #6ea8fe; --line: #2a3040; --ok: #3fb98a; --warn: #e0a83c; --fail: #e05d5d;
    --info: #5dade2; --review: #b58cf0;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { padding: 20px 28px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #141823, var(--bg)); }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
  header .sub { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
  main { max-width: 1180px; margin: 22px auto; padding: 0 20px 80px; }

  /* Run form */
  .runbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1 1 340px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
  .input { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; width: 100%; }
  .input:focus { outline: 2px solid rgba(110,168,254,.4); border-color: var(--accent); }
  .btn { background: var(--accent); color: #0b1020; border: none; border-radius: 8px; padding: 10px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.secondary { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); padding: 7px 13px; font-size: 13px; }
  .btn.secondary:hover { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .toast { display: none; margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
  .toast.show { display: block; }
  .toast.error { background: rgba(224,93,93,.14); color: var(--fail); border: 1px solid rgba(224,93,93,.4); }

  /* Cards */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .card > h2 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); display: flex; align-items: baseline; gap: 8px; }
  .card > h2 .count { color: var(--fg); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .card .lede { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
  .section { scroll-margin-top: 14px; }

  /* Status */
  .verdict { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status { font-size: 20px; font-weight: 700; letter-spacing: .5px; padding: 5px 14px; border-radius: 8px; }
  .status-PASS { background: rgba(63,185,138,.16); color: var(--ok); }
  .status-FAIL { background: rgba(224,93,93,.16); color: var(--fail); }
  .status-REVIEW { background: rgba(224,168,60,.16); color: var(--warn); }
  .status-BLOCKED { background: rgba(224,93,93,.12); color: #f08a8a; }
  .status-NOT_TESTED { background: rgba(152,161,179,.16); color: var(--muted); }
  .explanation { margin: 12px 0 0; font-size: 14.5px; max-width: 92ch; }
  .headline { color: var(--muted); margin: 6px 0 0; font-size: 13.5px; }

  /* Metric strip */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 16px; }
  .metric { background: var(--panel); padding: 12px 14px; }
  .metric .v { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .metric .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }

  /* Access banner */
  .banner { border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; border: 1px solid; display: flex; gap: 14px; align-items: flex-start; }
  .banner .ico { font-size: 20px; line-height: 1.2; }
  .banner h3 { margin: 0 0 4px; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; }
  .banner p { margin: 0 0 6px; font-size: 13.5px; }
  .banner .notdefect { font-size: 12.5px; opacity: .9; }
  .banner.AUTHENTICATION_REQUIRED { background: rgba(224,168,60,.10); border-color: rgba(224,168,60,.45); }
  .banner.AUTHENTICATION_REQUIRED h3 { color: var(--warn); }
  .banner.BOT_PROTECTION { background: rgba(181,140,240,.10); border-color: rgba(181,140,240,.45); }
  .banner.BOT_PROTECTION h3 { color: var(--review); }
  .banner.ACCESS_BLOCKED { background: rgba(224,93,93,.10); border-color: rgba(224,93,93,.45); }
  .banner.ACCESS_BLOCKED h3 { color: var(--fail); }
  .banner.UNKNOWN { background: rgba(152,161,179,.10); border-color: rgba(152,161,179,.4); }
  .banner.UNKNOWN h3 { color: var(--muted); }

  /* Chips */
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; margin: 2px 4px 2px 0; white-space: nowrap; }
  .chip.ok { background: rgba(63,185,138,.16); color: var(--ok); }
  .chip.warn { background: rgba(224,168,60,.16); color: var(--warn); }
  .chip.fail { background: rgba(224,93,93,.16); color: var(--fail); }
  .chip.review { background: rgba(181,140,240,.16); color: var(--review); }
  .chip.info { background: rgba(93,162,226,.16); color: var(--info); }
  .chip.muted { background: var(--panel-2); color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 12px; word-break: break-all; }

  /* Section nav */
  .nav { position: sticky; top: 0; z-index: 5; background: rgba(15,17,23,.94); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 16px; display: flex; gap: 4px; flex-wrap: wrap; }
  .nav a { color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; }
  .nav a:hover { color: var(--fg); background: var(--panel-2); text-decoration: none; }

  /* Columns / lists */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: none; }
  .kv { margin: 0; }
  .kv dt { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; margin-top: 10px; }
  .kv dt:first-child { margin-top: 0; }
  .kv dd { margin: 3px 0 0; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 10px 2px; font-size: 13.5px; }
  .empty b { color: var(--fg); font-weight: 600; }
  .err { color: var(--fail); }
  .loading { color: var(--muted); font-size: 13px; padding: 8px 0; }

  /* Expandables */
  details.item { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); margin-bottom: 8px; overflow: hidden; }
  details.item > summary { cursor: pointer; padding: 11px 14px; list-style: none; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-weight: 600; }
  details.item > summary::-webkit-details-marker { display: none; }
  details.item > summary::before { content: "\25B8"; color: var(--muted); transition: transform .12s ease; }
  details.item[open] > summary::before { transform: rotate(90deg); }
  details.item > summary .t { flex: 1 1 260px; min-width: 0; }
  details.item .body { padding: 4px 16px 14px; border-top: 1px solid var(--line); }
  details.item .body p { margin: 8px 0; }
  details.item .body h4 { margin: 14px 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }

  /* Findings */
  .finding.reproduced { border-left: 3px solid var(--fail); }
  .finding.unverified { border-left: 3px solid var(--muted); }
  .finding.review { border-left: 3px solid var(--warn); }
  .finding.cleared { border-left: 3px solid var(--ok); }

  /* Stages */
  .stages { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 4px; }
  .stage { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 600; }
  .stage .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .stage.done { color: var(--fg); }
  .stage.done .dot { background: var(--ok); }
.stage.current { color: #0b1020; background: var(--accent); border-color: var(--accent); }
.stage.current .dot { background: #0b1020; animation: pulse 1s ease-in-out infinite; }
.stage.failed { color: var(--fg); border-color: var(--fail); background: rgba(224,93,93,.14); }
.stage.failed .dot { background: var(--fail); }
.stage .mark { font-size: 11px; line-height: 1; font-weight: 700; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .runmeta { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.runrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.runrow .u { font-size: 12.5px; word-break: break-all; }
.changesgroup { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 16px 0 6px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.filters select, .filters input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; }
.c-new { color: var(--fail); }
.c-regressed { color: var(--fail); }
.c-resolved { color: var(--ok); }
.c-active { color: var(--warn); }
  .links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
.btn.secondary.danger:hover { border-color: var(--fail); color: var(--fail); }

/* Email settings. Reuses the card, chip, metric and field primitives above;
   the only new rules are the ones the existing set has no name for. */
.toast.ok { background: rgba(63,185,138,.14); color: var(--ok); border: 1px solid rgba(63,185,138,.4); }
.toggle-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 0; }
.toggle-row label { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; }
.toggle-state { font-size: 12px; font-weight: 700; letter-spacing: .5px; padding: 3px 10px; border-radius: 999px; }
.toggle-state.on { background: rgba(63,185,138,.16); color: var(--ok); }
.toggle-state.off { background: rgba(152,161,179,.16); color: var(--muted); }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; min-width: 0; }
legend { font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; padding: 0 6px; }
.eventlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 0; padding: 0; border: 0; }
.eventlist label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; min-width: 0; }
.eventlist .t { font-weight: 600; display: block; }
.eventlist .d { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
.recipientrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.recipientrow:last-of-type { border-bottom: none; }
.recipientrow .addr { flex: 1 1 200px; min-width: 0; word-break: break-all; }
.fielderror { color: var(--fail); font-size: 12.5px; margin-top: 6px; }
.fielderror:empty { display: none; }
.recipients:empty::after { content: "No recipients yet."; color: var(--muted); font-size: 13px; }
@media (max-width: 520px) {
  .eventlist { grid-template-columns: 1fr; }
  .recipientrow .addr { flex: 1 1 100%; }
}

/* --- top-level navigation ------------------------------------------------ */
.mainnav { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
.mainnav .brand { font-weight: 700; font-size: 15px; color: var(--fg); text-decoration: none; letter-spacing: .2px; }
.mainnav a:not(.brand) { color: var(--muted); text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 7px; border: 1px solid transparent; }
.mainnav a:not(.brand):hover { color: var(--fg); border-color: var(--line); }
.mainnav a.active { color: var(--fg); background: var(--panel-2); border-color: var(--line); }

/* --- in-app notifications -------------------------------------------------- */
.notifwrap { position: relative; margin-left: auto; }
.notifbell { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 14px; line-height: 1; color: var(--fg); }
.notifbell:hover { border-color: var(--accent); }
.notificon { display: inline-block; }
.notifbadge { position: absolute; top: -7px; right: -7px; min-width: 17px; padding: 1px 4px; border-radius: 999px; background: var(--fail); color: #fff; font-size: 10.5px; font-weight: 700; text-align: center; }
.notifpanel { position: absolute; right: 0; top: 40px; width: 380px; max-width: 84vw; max-height: 70vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.35); z-index: 40; }
.notifhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 4px 10px; border-bottom: 1px solid var(--line); }
.notifhead .muted { flex: 1 1 auto; font-size: 12px; }
.notifitem { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-left: 3px solid transparent; border-radius: 8px; padding: 9px 10px; cursor: pointer; color: var(--fg); }
.notifitem:hover { background: var(--panel-2); border-color: var(--line); }
.notifitem.unread { background: rgba(11,16,32,.05); border-left-color: var(--accent); }
.notifitem + .notifitem { margin-top: 6px; }
.notifrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.notiftitle { font-weight: 600; font-size: 13px; }
.notifmsg { color: var(--muted); font-size: 12.5px; margin: 4px 0 6px; }
.notiffoot { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11.5px; }
.notifempty { color: var(--muted); padding: 14px 4px; font-size: 13px; }
.notifdetail .lifecycle { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; }
.notifdetail .lifecycle li { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }

/* --- projects ------------------------------------------------------------ */
.projectgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.projectcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.projecthead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.projectname { font-weight: 700; font-size: 15px; }
.projectname a { color: var(--fg); text-decoration: none; }
.projectname a:hover { color: var(--accent); }
.projecturl { font-size: 12px; color: var(--muted); word-break: break-all; }
.projectfacts { display: flex; gap: 16px; flex-wrap: wrap; }
.projectfacts .v { font-size: 13px; }
.projectcard .links { margin-top: 2px; }

.runstable { width: 100%; border-collapse: collapse; font-size: 13px; }
.runstable th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
.runstable td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.runstable tr:last-child td { border-bottom: none; }
  .footer { color: var(--muted); font-size: 12px; margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
  .labelled { margin-top: 10px; }
  .labelled .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .labelled .v { margin-top: 2px; }
  .steps { list-style: none; margin: 6px 0 0; padding: 0; counter-reset: step; }
  .steps li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .steps li:last-child { border-bottom: none; }
  .steps .n { color: var(--muted); font-weight: 700; margin-right: 8px; }
</style>
</head>
<body>
<header>
  <h1>AI Website QA</h1>
  <div class="sub">Automated website testing with evidence-based results</div>
</header>
<main id="app"></main>
<script>
"use strict";

// ---------------------------------------------------------------------------
// The browser is a THIN renderer. Every value below comes from
// GET /api/qa/runs/:id/results, which is a bounded view of the report artifact
// the real QA engine already wrote. The client computes no verdict, no
// percentage, and no finding of its own.
// ---------------------------------------------------------------------------
// Stage tracker order. The authoritative list comes from the engine itself
// (RUN_STAGES, carried on every run as its stageView), so the tracker can never
// show an order the pipeline did not actually run. This is only the fallback for
// a run that has not reported any stage yet.
const STAGES = ["SCAN","ACCESS","GENERATE","ANALYZE","EXECUTE","VERIFY","COVERAGE","HISTORY","COMPLETE"];
const STAGE_LABEL = { SCAN: "Scan", ACCESS: "Access", GENERATE: "Generate", ANALYZE: "Analyze", EXECUTE: "Execute", VERIFY: "Verify", COVERAGE: "Coverage", HISTORY: "History", COMPLETE: "Complete" };

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined && text !== null) n.textContent = text; return n; };
const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
const arr = (v) => (Array.isArray(v) ? v : []);
const link = (href, text, title) => { const a = el("a", null, text); a.href = href; if (title) a.title = title; return a; };
const chip = (text, cls) => el("span", "chip " + (cls || "muted"), text);

const STATUS_CLASS = { PASS: "ok", FAIL: "fail", REVIEW: "warn", BLOCKED: "fail", NOT_TESTED: "muted" };
const SEVERITY_CLASS = { CRITICAL: "fail", HIGH: "fail", MEDIUM: "warn", LOW: "info", INFO: "muted" };
const VERDICT_CLASS = { REPRODUCED: "fail", NOT_REPRODUCED: "ok", PASS: "ok", REVIEW_REQUIRED: "warn", REVIEW: "warn", BLOCKED: "fail", NOT_EXECUTED: "muted", DISCOVERED_ONLY: "muted", INFRASTRUCTURE_PROBLEM: "review" };

const statusChip = (status) => chip(status || "UNKNOWN", STATUS_CLASS[status] || "muted");
const verdictChip = (status) => chip(status || "UNKNOWN", VERDICT_CLASS[status] || "muted");
const severityChip = (severity) => chip(severity || "INFO", SEVERITY_CLASS[severity] || "muted");
const priorityChip = (priority) => chip(priority || "P?", priority === "P0" || priority === "P1" ? "fail" : priority === "P2" ? "warn" : "info");

const card = (title, countText) => {
  const c = el("div", "card");
  const h = el("h2", null, title);
  if (countText) h.appendChild(el("span", "count", countText));
  c.appendChild(h);
  return c;
};
const section = (title, id, countText, lede) => {
  const c = card(title, countText);
  c.id = id;
  c.classList.add("section");
  if (lede) c.appendChild(el("p", "lede", lede));
  return c;
};
const addKV = (dl, label, value) => {
  if (value === undefined || value === null || value === "") return;
  dl.appendChild(el("dt", null, label));
  dl.appendChild(el("dd", null, String(value)));
};
const labelled = (label, value) => {
  const w = el("div", "labelled");
  w.appendChild(el("div", "k", label));
  w.appendChild(el("div", "v", String(value)));
  return w;
};
const row = (ul, label, value, valueNode) => {
  const li = el("li");
  const r = el("div", "runrow");
  r.appendChild(el("span", "muted", label));
  r.appendChild(valueNode || el("strong", null, String(value)));
  li.appendChild(r);
  ul.appendChild(li);
  return li;
};
const STAGE_SYMBOL = { done: "✓", current: "●", failed: "✕", pending: "○" };
// The logical stage view the backend computed by replaying the engine's events.
// A stage that legitimately runs twice (Generate: scenario suite, then the
// verification spec) stays ONE chip: the backend keeps its completed state
// instead of letting a second window drag it back to running, so the tracker
// never looks like the pipeline restarted. Both real windows are still in
// run.stageHistory. Nothing here is timed or estimated.
const LOGICAL_CLASS = { pending: "pending", running: "current", completed: "done", failed: "failed" };
const stageViewFrom = (run) => {
  const byStage = {};
  for (const stage of arr(run.stageView)) byStage[stage.stage] = stage;
  return byStage;
};
const stageOrderFrom = (run) => {
  const fromEngine = arr(run.stageView).map(stage => String(stage.stage || "").toUpperCase()).filter(name => STAGE_LABEL[name]);
  return fromEngine.length ? fromEngine : STAGES;
};
const stageChip = (name, state) => {
  const s = el("span", "stage " + state);
  s.appendChild(el("span", "dot"));
  s.appendChild(el("span", "mark", STAGE_SYMBOL[state] || STAGE_SYMBOL.pending));
  s.appendChild(el("span", null, STAGE_LABEL[name] || name));
  return s;
};
const formatMs = (ms) => {
  const value = num(ms);
  if (value <= 0) return null;
  if (value < 1000) return value + " ms";
  if (value < 60000) return (value / 1000).toFixed(1) + " s";
  return Math.floor(value / 60000) + "m " + Math.round((value % 60000) / 1000) + "s";
};
const formatTime = (iso) => {
  if (typeof iso !== "string" || !iso) return null;
  const d = new Date(iso);
  return isNaN(d.getTime()) ? iso : d.toLocaleString();
};

const app = document.getElementById("app");
let activeRunId = null;
let pollTimer = null;
let busy = false;
let onRunCompleted = null;
let reloadFindings = null;

// ---------------------------------------------------------------------------
// Shell
// ---------------------------------------------------------------------------
function shell() {
  app.innerHTML = "";
  app.appendChild(mainNav());
  const mount = el("div");
  mount.id = "view";
  app.appendChild(mount);
}

// ---------------------------------------------------------------------------
// Navigation + routing
//
// Four views, chosen from the path. There is no router library here on purpose:
// / is the QA console, /projects lists saved websites, /projects/:id shows one,
// and /schedules shows every project's QA schedule.
// ---------------------------------------------------------------------------
function mainNav() {
  const bar = el("nav", "mainnav");
  const brand = el("a", "brand", "AI Website QA");
  brand.href = "/";
  bar.appendChild(brand);
  const current = location.pathname;
  const items = [["/", "Recent Runs"], ["/projects", "Projects"], ["/schedules", "Schedules"], ["/dashboard", "Dashboard"]];
  for (const [href, label] of items) {
    const a = el("a", null, label);
    a.href = href;
    if (href === current || (href !== "/" && current.startsWith(href))) a.classList.add("active");
    if (href === "/dashboard") { a.target = "_blank"; a.rel = "noopener"; }
    bar.appendChild(a);
  }
  // The notification bell lives in the same nav bar on every page, so an
  // unattended notification is reachable from wherever the user already is.
  bar.appendChild(notificationBell());
  return bar;
}

function renderRoute() {
  clearTimeout(pollTimer);
  pollTimer = null;
  activeRunId = null;
  busy = false;
  onRunCompleted = null;
  reloadFindings = null;
  app.innerHTML = "";
  app.appendChild(mainNav());
  const mount = el("div");
  mount.id = "view";
  app.appendChild(mount);
  const projectMatch = location.pathname.match(/^\/projects\/([^/]+)\/?$/);
  if (projectMatch) return renderProjectPage(mount, decodeURIComponent(projectMatch[1]));
  if (location.pathname === "/projects" || location.pathname === "/projects/") return renderProjectsPage(mount);
  if (location.pathname === "/schedules" || location.pathname === "/schedules/") return renderSchedulesPage(mount);
  renderHomePage(mount);
}

function navigate(path) {
  history.pushState({}, "", path);
  renderRoute();
}
window.addEventListener("popstate", renderRoute);

// ---------------------------------------------------------------------------
// In-app notifications
//
// The bell is a THIN reader of GET /api/notifications. Every title, message,
// type, severity and timestamp below is rendered exactly as the server recorded
// it: this page decides nothing about whether an event happened, how important
// it is, or what it means. Opening the panel does not mark anything read - only
// clicking a notification or pressing "Mark all as read" does.
// ---------------------------------------------------------------------------
const NOTIFICATION_LABEL = {
  NEW_FINDING: "New finding",
  REGRESSED_FINDING: "Finding regressed",
  RESOLVED_FINDING: "Finding resolved",
  RUN_FAILED: "Run failed",
  ACCESS_CHANGED: "Access changed",
  SCHEDULE_SKIPPED: "Scheduled run skipped",
  MEANINGFUL_CHANGE: "Meaningful change",
};

const FINDING_NOTIFICATION_TYPES = ["NEW_FINDING", "REGRESSED_FINDING", "RESOLVED_FINDING"];

/** "4m ago" for recent events, the real timestamp for anything older. */
const notificationAgo = (iso) => {
  if (typeof iso !== "string" || !iso) return NOT_AVAILABLE;
  const then = Date.parse(iso);
  if (!isFinite(then)) return iso;
  const seconds = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (seconds < 60) return seconds + "s ago";
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return minutes + "m ago";
  const hours = Math.round(minutes / 60);
  if (hours < 24) return hours + "h ago";
  const days = Math.round(hours / 24);
  if (days < 30) return days + "d ago";
  return formatTime(iso) || iso;
};

/**
 * Where a notification leads, using routes this app already has: a tracked
 * finding lives on its project page, a run's results live on the console, and
 * anything else about a project leads to that project. No new page is invented.
 */
const notificationDestination = (n) => {
  const project = "/projects/" + encodeURIComponent(n.projectId);
  if (n.findingId && FINDING_NOTIFICATION_TYPES.indexOf(n.type) !== -1) {
    return { path: project + "?finding=" + encodeURIComponent(n.findingId), runId: null };
  }
  if (n.runId) return { path: "/", runId: n.runId };
  return { path: project, runId: null };
};

const postNotification = (path) =>
  apiJson(path, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });

/** Opens a notification: navigate to its destination, and only then mark it read. */
const openNotification = async (n) => {
  const target = notificationDestination(n);
  navigate(target.path);
  if (target.runId) {
    setTimeout(() => {
      const panel = document.getElementById("result-panel");
      openHistoricalRun(target.runId, document.getElementById("run-panel"), panel);
    }, 0);
  }
  await postNotification("/api/notifications/" + encodeURIComponent(n.id) + "/read");
};

const notificationItem = (n, onChanged) => {
  const item = el("button", n.read ? "notifitem" : "notifitem unread");
  item.type = "button";
  item.dataset.notificationId = n.id;
  item.dataset.notificationType = n.type;
  item.dataset.read = n.read ? "1" : "0";
  if (!n.read) item.dataset.unread = "1";
  const head = el("div", "notifrow");
  head.appendChild(el("span", "notiftitle", n.title));
  head.appendChild(chip(NOTIFICATION_LABEL[n.type] || n.type, "muted"));
  if (n.severity) head.appendChild(severityChip(n.severity));
  item.appendChild(head);
  item.appendChild(el("div", "notifmsg", n.message));
  const foot = el("div", "notiffoot");
  foot.appendChild(el("span", null, notificationAgo(n.createdAt)));
  foot.appendChild(el("span", null, n.projectName || ""));
  item.appendChild(foot);
  item.addEventListener("click", async () => {
    await openNotification(n);
    if (onChanged) onChanged();
  });
  return item;
};

/** The panel's contents: header with the unread count, mark-all, then the items. */
const notificationPanelBody = (data, onChanged) => {
  const frag = document.createDocumentFragment();
  const head = el("div", "notifhead");
  head.appendChild(el("strong", null, "Notifications"));
  const unread = num(data.unreadCount);
  head.appendChild(el("span", "muted", unread === 0 ? "No unread notifications" : unread + " unread"));
  const markAll = el("button", "btn secondary", "Mark all as read");
  markAll.type = "button";
  markAll.id = "notif-mark-all";
  markAll.disabled = unread === 0;
  markAll.addEventListener("click", async (event) => {
    event.stopPropagation();
    await postNotification("/api/notifications/read-all");
    if (onChanged) onChanged();
  });
  head.appendChild(markAll);
  frag.appendChild(head);

  const items = arr(data.notifications);
  // No sample rows are ever shown: an empty inbox says so and nothing else.
  if (!items.length) {
    frag.appendChild(el("div", "notifempty", "No notifications yet."));
    return frag;
  }
  for (const item of items) frag.appendChild(notificationItem(item, onChanged));
  return frag;
};

function notificationBell() {
  const wrap = el("div", "notifwrap");
  const button = el("button", "notifbell");
  button.type = "button";
  button.id = "notification-bell";
  button.setAttribute("aria-label", "Notifications");
  button.setAttribute("aria-expanded", "false");
  button.appendChild(el("span", "notificon", "🔔"));
  const badge = el("span", "notifbadge");
  badge.id = "notification-badge";
  // A zero unread count shows no badge at all, rather than a misleading "0".
  badge.hidden = true;
  button.appendChild(badge);
  wrap.appendChild(button);

  let panel = null;

  const applyBadge = (count) => {
    if (count > 0) {
      badge.textContent = String(count);
      badge.hidden = false;
    } else {
      badge.textContent = "";
      badge.hidden = true;
    }
  };

  const closePanel = () => {
    if (!panel) return;
    panel.remove();
    panel = null;
    button.setAttribute("aria-expanded", "false");
  };

  const fillPanel = async () => {
    const { ok, body } = await apiJson("/api/notifications?limit=50");
    if (!panel) return;
    panel.innerHTML = "";
    if (!ok) {
      panel.appendChild(el("p", "err", (body && body.error) || "Notifications could not be loaded."));
      return;
    }
    applyBadge(num(body.unreadCount));
    panel.appendChild(notificationPanelBody(body, () => { fillPanel(); refreshBadge(); }));
  };

  const refreshBadge = async () => {
    const { ok, body } = await apiJson("/api/notifications/unread-count");
    if (ok) applyBadge(num(body.count));
  };

  button.addEventListener("click", () => {
    if (panel) { closePanel(); return; }
    panel = el("div", "notifpanel");
    panel.id = "notification-panel";
    panel.appendChild(el("div", "loading", "Loading notifications…"));
    wrap.appendChild(panel);
    button.setAttribute("aria-expanded", "true");
    fillPanel();
  });

  refreshBadge();
  return wrap;
}

function renderHomePage(mount) {
  const runCard = card("Run a QA check");
  runCard.appendChild(el("p", "lede", "Enter a website URL. The real QA engine scans the site, executes safe tests, and produces evidence-based results."));
  const bar = el("div", "runbar");
  const field = el("div", "field");
  const label = el("label", null, "Website URL"); label.setAttribute("for", "url");
  const input = el("input", "input"); input.id = "url"; input.type = "url"; input.placeholder = "https://example.com"; input.autocomplete = "off";
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") startRun(); });
  field.appendChild(label); field.appendChild(input);
  const btn = el("button", "btn", "Run QA"); btn.id = "run-btn"; btn.type = "button";
  btn.dataset.runBtn = "1"; btn.dataset.runLabel = "Run QA";
  btn.addEventListener("click", () => startRun(null));
  bar.appendChild(field); bar.appendChild(btn);
  runCard.appendChild(bar);
  runCard.appendChild(el("div", "hint", "Tip: save the site as a Project to run QA against it again and keep its history."));
  const toast = el("div", "toast"); toast.id = "toast";
  runCard.appendChild(toast);
  mount.appendChild(runCard);

  const runPanel = el("div"); runPanel.id = "run-panel"; mount.appendChild(runPanel);
  const resultPanel = el("div"); resultPanel.id = "result-panel"; mount.appendChild(resultPanel);

  const recentCard = card("Recent Runs"); recentCard.id = "recent-card";
  const recentBody = el("div"); recentBody.id = "recent-body";
  recentBody.appendChild(el("div", "empty", "Loading recent runs…"));
  recentCard.appendChild(recentBody);
  mount.appendChild(recentCard);

  const footer = el("div", "footer");
  footer.appendChild(el("span", null, "Read-only view of real QA engine runs. No results are simulated."));
  footer.appendChild(document.createTextNode(" "));
  footer.appendChild(link("/dashboard", "Open the full evidence explorer →"));
  mount.appendChild(footer);
  refreshRecent();
}

function showError(message) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.className = "toast error show";
  t.textContent = message;
}
function clearToast() { const t = document.getElementById("toast"); if (t) { t.className = "toast"; t.textContent = ""; } }

function setBusy(next) {
  busy = next;
  for (const btn of document.querySelectorAll("[data-run-btn]")) {
    btn.disabled = next;
    if (btn.dataset.runLabel) btn.textContent = next ? (btn.dataset.busyLabel || "Running…") : btn.dataset.runLabel;
  }
  const input = document.getElementById("url");
  if (input) input.disabled = next;
}

// ---------------------------------------------------------------------------
// Start + poll a real run
// ---------------------------------------------------------------------------
async function startRun(projectId) {
  if (busy) return;
  const input = document.getElementById("url");
  const url = projectId ? null : ((input && input.value) || "").trim();
  clearToast();
  if (!projectId && !url) { showError("Enter a website URL to test."); return; }
  setBusy(true);
  try {
    // A project run reuses the exact same endpoint pair the console uses; the
    // only difference is that the server takes the URL from the saved project.
    const [path, body] = projectId
      ? ["/api/projects/" + encodeURIComponent(projectId) + "/runs", {}]
      : ["/api/qa/run", { url }];
    const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) { showError(data.error || "Could not start the QA run."); setBusy(false); return; }
    activeRunId = data.run.runId;
    renderRunPanel(data.run);
    const panel = document.getElementById("result-panel");
    if (panel) panel.innerHTML = "";
    schedulePoll(400);
  } catch {
    showError("Could not reach the QA server. Is the dashboard still running?");
    setBusy(false);
  }
}

function schedulePoll(delay) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(pollOnce, delay);
}

async function pollOnce() {
  if (!activeRunId) return;
  let data;
  try {
    const res = await fetch("/api/qa/runs/" + encodeURIComponent(activeRunId));
    if (!res.ok) { showError("The run could not be found."); setBusy(false); return; }
    data = await res.json();
  } catch {
    showError("Lost connection to the QA server.");
    setBusy(false);
    return;
  }
  const run = data.run;
  renderRunPanel(run);
  if (run.state === "RUNNING") { schedulePoll(1200); return; }
  setBusy(false);
  if (run.state === "FAILED") showError(run.error || "The QA run failed before producing a report.");
  if (run.state === "COMPLETED") await loadResult(run);
  refreshRecent();
  // A project page refreshes its saved summary from the artifact the run just
  // wrote; the results panel above is left in place so the run stays readable.
  if (onRunCompleted && (run.state === "COMPLETED" || run.state === "FAILED")) {
    const done = onRunCompleted;
    onRunCompleted = null;
    await done();
  }
}

function renderRunPanel(run) {
  const panel = document.getElementById("run-panel");
  if (!panel) return;
  panel.innerHTML = "";
  const c = card(run.state === "RUNNING" ? "Run in progress" : run.state === "COMPLETED" ? "Run complete" : "Run failed");
  const stages = el("div", "stages");
  // Real per-stage state from the engine's own events, in the order the engine
  // ran them. Nothing is inferred from elapsed time, and a stage the engine
  // never reached stays pending.
  const view = stageViewFrom(run);
  for (const name of stageOrderFrom(run)) {
    const stage = view[String(name).toLowerCase()];
    let state = stage ? (LOGICAL_CLASS[stage.state] || "pending") : "pending";
    if (!stage && run.state === "RUNNING" && name === run.stage) state = "current";
    stages.appendChild(stageChip(name, state));
  }
  c.appendChild(stages);
  const meta = el("div", "runmeta");
  if (run.state === "RUNNING") {
    // Prefer the stage actually doing work over the last event, so a stage that
    // has already finished does not get reported as the live one.
    const key = String(run.runningStage || run.currentStage || run.stage || "").toUpperCase();
    const label = STAGE_LABEL[key] || key || "starting";
    const stage = view[String(key).toLowerCase()];
    const stateWord = !stage ? "running" : stage.state === "failed" ? "failed" : stage.state === "completed" ? "completed" : "running";
    meta.appendChild(el("span", null, "Current stage: " + label + " (" + stateWord + ") · "));
  }
  meta.appendChild(el("span", null, "Target: "));
  meta.appendChild(el("code", null, run.url));
  c.appendChild(meta);
  if (run.state === "FAILED" && run.error) c.appendChild(el("p", "err", run.error));
  // A stage that failed explains itself with the engine's own redacted message.
  for (const name of stageOrderFrom(run)) {
    const stage = view[String(name).toLowerCase()];
    if (stage && stage.state === "failed" && stage.error) c.appendChild(el("p", "err", (STAGE_LABEL[name] || name) + " failed: " + stage.error));
  }
  panel.appendChild(c);
}

// ---------------------------------------------------------------------------
// Load the productized results view
// ---------------------------------------------------------------------------
async function loadResult(run) {
  const panel = document.getElementById("result-panel");
  if (!panel) return;
  panel.innerHTML = "";
  const loading = card("Results");
  loading.appendChild(el("div", "loading", "Loading the results for this run…"));
  panel.appendChild(loading);
  try {
    const res = await fetch("/api/qa/runs/" + encodeURIComponent(run.runId) + "/results");
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      panel.innerHTML = "";
      panel.appendChild(renderUnavailable(run, (data && data.error) || "The full report for this run is not available."));
      return;
    }
    panel.innerHTML = "";
    renderResult(data.results, run, data.findingsChanges, data.projectId, data.whatChanged);
  } catch {
    panel.innerHTML = "";
    panel.appendChild(renderUnavailable(run, "The results view could not be loaded."));
  }
}

/** Honest fallback: never invent a result for an artifact we cannot read. */
function renderUnavailable(run, message) {
  const c = card("Results unavailable");
  c.appendChild(el("p", null, message));
  c.appendChild(el("p", "muted", "This run's full report artifact is not readable, so no results are shown rather than a partial or invented summary."));
  const links = el("div", "links");
  links.appendChild(link("/api/qa/runs/" + encodeURIComponent(run.runId) + "/report", "Raw JSON report"));
  if (run.historyRunId) links.appendChild(link("/dashboard#/runs/" + encodeURIComponent(run.historyRunId) + "/findings", "Open persisted evidence in the explorer →"));
  c.appendChild(links);
  return c;
}

// ---------------------------------------------------------------------------
// Result rendering
// ---------------------------------------------------------------------------
function renderResult(results, run, changes, projectId, whatChanged) {
  const panel = document.getElementById("result-panel");
  if (!panel) return;
  panel.appendChild(renderNav(results, Boolean(changes), Boolean(whatChanged)));
  panel.appendChild(renderOverview(results, run));
  // What Changed is the primary cross-dimension section for a project run, and
  // sits directly under the overview. It carries its own availability, so a
  // standalone run or an uncomparable pair shows the exact reason instead of a
  // reassuring blank.
  if (whatChanged) panel.appendChild(renderWhatChanged(whatChanged, run, projectId));
  if (results.access) panel.appendChild(renderAccess(results.access));
  // Findings Changes appears ONLY when a real project comparison exists. A
  // standalone run, and a project run with no comparable predecessor, both
  // render the Results Experience exactly as before with nothing invented.
  if (changes) panel.appendChild(renderFindingsChanges(changes, run, projectId));
  panel.appendChild(renderMetrics(results));
  panel.appendChild(renderFindings(results));
  panel.appendChild(renderVerification(results));
  panel.appendChild(renderCoverage(results));
  panel.appendChild(renderGaps(results));
  panel.appendChild(renderFlows(results));
  panel.appendChild(renderReports(results, run));
}

function renderNav(results, hasChanges, hasWhatChanged) {
  const nav = el("div", "nav");
  nav.id = "result-nav";
  const base = hasChanges
    ? [["changes", "Findings changes"], ["findings", "Findings"], ["verification", "Verification"], ["coverage", "Coverage"], ["gaps", "Gaps"], ["flows", "Test flows"], ["reports", "Reports"]]
    : [["findings", "Findings"], ["verification", "Verification"], ["coverage", "Coverage"], ["gaps", "Gaps"], ["flows", "Test flows"], ["reports", "Reports"]];
  const entries = hasWhatChanged ? [["what-changed", "What changed"]].concat(base) : base;
  for (const [id, label] of entries) {
    const a = el("a", null, label);
    a.href = "#" + id;
    a.addEventListener("click", (e) => {
      const target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    nav.appendChild(a);
  }
  return nav;
}

// Descriptive lifecycle labels. Deliberately no score, no rank, no "healthy".
const LIFECYCLE_LABEL = { NEW: "New", ACTIVE: "Still active", REGRESSED: "Regressed", RESOLVED: "Resolved" };
const LIFECYCLE_CLASS = { NEW: "fail", ACTIVE: "warn", REGRESSED: "fail", RESOLVED: "ok" };

/**
 * Findings Changes: how this run's findings differ from the project's previous
 * comparable run. Every number is a count of real finding identities, and each
 * entry links to the evidence that already exists for it.
 */
// ---------------------------------------------------------------------------
// What Changed — the run-to-run comparison, told as evidence.
//
// Everything below is a count or a recorded state taken from two real report
// artifacts. There is no score, no rank, and no "better"/"worse" verdict: a
// change is a difference, and a difference is not automatically an improvement.
// Anything the artifacts do not support is shown as unavailable with its
// machine-readable reason, never as zero.
// ---------------------------------------------------------------------------

/** The exact reason text, so a reader is never left guessing. */
const CHANGE_REASON_TEXT = {
  NO_PREVIOUS_RUN: "No previous run",
  PREVIOUS_RUN_INCOMPLETE: "The previous run did not complete enough testing to compare",
  CURRENT_RUN_INCOMPLETE: "This run did not complete enough testing to compare",
  ACCESS_BOUNDARY: "The access state changed between these runs",
  INSUFFICIENT_EVIDENCE: "Not enough recorded evidence to compare",
};

const changeTone = (kind) => (kind === "added" || kind === "new" || kind === "regressed" ? "fail" : kind === "removed" || kind === "resolved" ? "ok" : "muted");

/** An expandable group. Collapsed by default so the section stays scannable. */
function changeGroup(title, items, renderItem, emptyText) {
  const items_ = arr(items);
  const box = el("div", "changegroup");
  const details = el("details");
  const summary = el("summary");
  summary.appendChild(document.createTextNode(title + " (" + items_.length + ")"));
  details.appendChild(summary);
  if (!items_.length) {
    details.appendChild(el("p", "muted", emptyText || "No recorded change."));
  } else {
    const list = el("div", "list");
    for (const item of items_) {
      const node = renderItem(item);
      if (node) list.appendChild(node);
    }
    details.appendChild(list);
  }
  box.appendChild(details);
  return box;
}

/** A measurement row: current, previous, and the delta — or "not available". */
function changeMeasure(label, block, key, unit) {
  const current = block.current ? block.current[key] : null;
  const previous = block.previous ? block.previous[key] : null;
  const delta = block.delta ? block.delta[key] : null;
  const li = el("li", "measure");
  li.appendChild(el("span", "u", label));
  const values = el("span", "muted");
  const show = v => (v == null ? NOT_AVAILABLE : String(v) + (unit ? " " + unit : ""));
  let deltaText = "delta " + (delta == null ? NOT_AVAILABLE : (delta > 0 ? "+" + delta : String(delta)));
  values.appendChild(document.createTextNode(
    "this run " + show(current) + " · previous " + show(previous) + " · " + deltaText
  ));
  li.appendChild(values);
  return li;
}

function renderWhatChanged(summary, run, projectId) {
  const c = section("What Changed", "what-changed", null,
    "A comparison of this run with the project's previous run, read from both real report artifacts. Changes are differences, not judgements.");

  const linkLine = "Compared with run " + (summary.previousRunId || NOT_AVAILABLE) + ".";
  c.appendChild(el("p", "muted", linkLine));

  // No honest comparison: say exactly why, and claim nothing.
  if (!summary.comparisonAvailable) {
    const why = el("p", "unavailable-reason");
    why.appendChild(chip(summary.reason || "INSUFFICIENT_EVIDENCE", "muted"));
    why.appendChild(document.createTextNode(" " + (CHANGE_REASON_TEXT[summary.reason] || "Comparison unavailable") + "."));
    c.appendChild(why);
    if (summary.reasonDetail) c.appendChild(el("p", "muted", summary.reasonDetail));
    c.appendChild(changeLinks(run, projectId));
    return c;
  }

  // PARTIAL across an access boundary: the transition is real, so show it, and
  // say plainly that nothing else is being claimed.
  if (summary.availability === "PARTIAL") {
    const banner = el("p", "unavailable-reason");
    banner.appendChild(chip(summary.reason || "ACCESS_BOUNDARY", "warn"));
    banner.appendChild(document.createTextNode(" " + (summary.reasonDetail || "Only the access transition is reported.")));
    c.appendChild(banner);
  }

  const strip = el("div", "metrics");
  const cell = (label, value, tone) => {
    const m = el("div", "metric");
    m.appendChild(el("div", "v", String(value)));
    m.appendChild(el("div", "k", label));
    if (tone) m.classList.add("tone-" + tone);
    return m;
  };
  const f = summary.findings || {};
  const p = summary.pages || {};
  const fl = summary.flows || {};
  const e = summary.elements || {};
  const counted = (list, kind) => arr(list).length || (kind === "added" ? 0 : 0);
  strip.appendChild(cell("New findings", counted(f.new, "new"), "fail"));
  strip.appendChild(cell("Resolved", counted(f.resolved, "resolved"), "ok"));
  strip.appendChild(cell("Regressed", counted(f.regressed, "regressed"), "fail"));
  strip.appendChild(cell("Pages changed", counted(p.added, "added") + counted(p.removed, "removed"), null));
  strip.appendChild(cell("Flows changed", counted(fl.statusChanged, "added") + counted(fl.added, "added") + counted(fl.removed, "removed"), null));
  strip.appendChild(cell("Interactive elements", num(e.interactiveAdded) + " added / " + num(e.interactiveRemoved) + " removed", null));
  c.appendChild(strip);

  // An honest "nothing changed" is a useful, real statement.
  const nothingChanged =
    !arr(f.new).length && !arr(f.resolved).length && !arr(f.regressed).length &&
    !arr(p.added).length && !arr(p.removed).length &&
    !arr(fl.added).length && !arr(fl.removed).length && !arr(fl.statusChanged).length &&
    !arr(e.added).length && !arr(e.removed).length && !arr(e.unmatched).length;
  if (nothingChanged) {
    c.appendChild(el("p", "nochange", "No material changes detected between the comparable runs."));
  }

  // ---- Findings (changed only; the full breakdown stays in Findings Changes).
  const changedFindings = [].concat(arr(f.new), arr(f.resolved), arr(f.regressed));
  c.appendChild(changeGroup("Findings", changedFindings, (ref) => {
    const li = el("li");
    const head = el("div", "runrow");
    head.appendChild(el("span", "u", ref.title || ref.id));
    const tags = el("span");
    tags.appendChild(chip(ref.severity, ref.severity === "CRITICAL" || ref.severity === "HIGH" ? "fail" : "muted"));
    tags.appendChild(chip(LIFECYCLE_LABEL[ref.status] || ref.status, LIFECYCLE_CLASS[ref.status] || "muted"));
    head.appendChild(tags);
    li.appendChild(head);
    if (ref.page) li.appendChild(el("div", "muted", ref.page));
    // The existing historical-intelligence record, shown as recorded.
    const history = summary.history && summary.history.findingReferences ? summary.history.findingReferences[ref.id] : null;
    if (history) {
      li.appendChild(el("div", "muted",
        "History: " + history.lifecycle + " · confidence " + history.confidence + " · seen in " + arr(history.runIds).length + " run(s)"));
    }
    const links = el("div", "links");
    if (projectId) links.appendChild(link("/projects/" + encodeURIComponent(projectId), "Tracked finding →"));
    if (links.childNodes.length) li.appendChild(links);
    return li;
  }, "No finding changed between these runs."));

  // ---- Pages
  const pageItem = kind => (page) => {
    const li = el("li");
    const head = el("div", "runrow");
    head.appendChild(el("span", "u", page.title || page.url));
    head.appendChild(chip(kind, changeTone(kind)));
    li.appendChild(head);
    li.appendChild(el("div", "muted", page.url));
    return li;
  };
  const pageUnavailable = p.available === false
    ? el("p", "muted", (p.reason ? CHANGE_REASON_TEXT[p.reason] || p.reason : "Not compared") + (p.note ? ". " + p.note : "."))
    : null;
  const pagesBox = el("div", "changegroup");
  const pagesDetails = el("details");
  const pagesSummary = el("summary");
  pagesSummary.appendChild(document.createTextNode("Pages (" + (arr(p.added).length + arr(p.removed).length) + ")"));
  pagesDetails.appendChild(pagesSummary);
  if (pageUnavailable) pagesDetails.appendChild(pageUnavailable);
  else if (!arr(p.added).length && !arr(p.removed).length) pagesDetails.appendChild(el("p", "muted", "No page was added or removed."));
  else {
    const list = el("div", "list");
    for (const page of arr(p.added)) list.appendChild(pageItem("added")(page));
    for (const page of arr(p.removed)) list.appendChild(pageItem("removed")(page));
    pagesDetails.appendChild(list);
  }
  pagesBox.appendChild(pagesDetails);
  c.appendChild(pagesBox);

  // ---- Flows
  const flowsBox = el("div", "changegroup");
  const flowsDetails = el("details");
  const flowsSummary = el("summary");
  flowsSummary.appendChild(document.createTextNode("Flows (" + (arr(fl.added).length + arr(fl.removed).length + arr(fl.statusChanged).length) + ")"));
  flowsDetails.appendChild(flowsSummary);
  if (fl.available === false) {
    flowsDetails.appendChild(el("p", "muted", (fl.reason ? CHANGE_REASON_TEXT[fl.reason] || fl.reason : "Not compared") + (fl.note ? ". " + fl.note : ".")));
  } else if (!arr(fl.added).length && !arr(fl.removed).length && !arr(fl.statusChanged).length) {
    flowsDetails.appendChild(el("p", "muted", "No flow was added, removed or changed status."));
  } else {
    const list = el("div", "list");
    for (const change of arr(fl.statusChanged)) {
      const li = el("li");
      const head = el("div", "runrow");
      head.appendChild(el("span", "u", change.title || change.category || change.id));
      head.appendChild(chip(change.transition, changeTone("changed")));
      li.appendChild(head);
      const meta = el("div", "muted");
      meta.appendChild(document.createTextNode(
        change.category ? change.category + " · " : ""
        + (change.reason === "STEPS_CHANGED" ? "same flow family, changed steps" : "same flow, different recorded status")
        + " · " + change.count + " flow(s)"
        + (change.evidenceBacked ? "" : " · " + change.note)
      ));
      li.appendChild(meta);
      list.appendChild(li);
    }
    for (const flow of arr(fl.added)) list.appendChild(flowItem("added", flow));
    for (const flow of arr(fl.removed)) list.appendChild(flowItem("removed", flow));
    flowsDetails.appendChild(list);
  }
  flowsBox.appendChild(flowsDetails);
  c.appendChild(flowsBox);

  // ---- Elements
  const eBox = el("div", "changegroup");
  const eDetails = el("details");
  const eSummary = el("summary");
  eSummary.appendChild(document.createTextNode("Elements (" + (arr(e.added).length + arr(e.removed).length + arr(e.unmatched).length) + ")"));
  eDetails.appendChild(eSummary);
  if (e.available === false) {
    eDetails.appendChild(el("p", "muted", (e.reason ? CHANGE_REASON_TEXT[e.reason] || e.reason : "Not compared") + (e.note ? ". " + e.note : ".")));
  } else {
    eDetails.appendChild(el("p", "muted",
      num(e.added) + " added · " + num(e.removed) + " removed · " + num(e.unmatched) + " unmatched · "
      + num(e.interactiveAdded) + " interactive added · " + num(e.interactiveRemoved) + " interactive removed"
      + (e.note ? " · " + e.note : "")));
    const list = el("div", "list");
    const elementItem = kind => (item) => {
      const li = el("li");
      const head = el("div", "runrow");
      head.appendChild(el("span", "u", item.accessibleName || item.text || item.tag));
      const tags = el("span");
      tags.appendChild(chip(kind, changeTone(kind)));
      if (item.interactive) tags.appendChild(chip("interactive", "muted"));
      tags.appendChild(chip(item.tag, "muted"));
      if (item.role) tags.appendChild(chip(item.role, "muted"));
      head.appendChild(tags);
      li.appendChild(head);
      return li;
    };
    for (const item of arr(e.added)) list.appendChild(elementItem("added")(item));
    for (const item of arr(e.removed)) list.appendChild(elementItem("removed")(item));
    for (const item of arr(e.unmatched)) list.appendChild(elementItem("unmatched")(item));
    eDetails.appendChild(list);
  }
  eBox.appendChild(eDetails);
  c.appendChild(eBox);

  // ---- Verification
  const vBox = el("div", "changegroup");
  const vDetails = el("details");
  const vSummary = el("summary");
  vSummary.appendChild(document.createTextNode("Verification"));
  vDetails.appendChild(vSummary);
  if (summary.verification && summary.verification.available === false) {
    vDetails.appendChild(el("p", "muted", (summary.verification.note || "Not compared.")));
  } else {
    const list = el("div", "list");
    for (const [label, key] of [
      ["Findings scheduled", "scheduled"],
      ["Findings executed", "executed"],
      ["Reproduced", "reproduced"],
      ["Not reproduced", "notReproduced"],
      ["Skipped", "skipped"],
      ["Review required", "reviewRequired"],
      ["Unverified", "unverified"],
      ["Infrastructure problems", "infrastructureProblems"],
      ["Infrastructure failures", "infrastructureFailures"],
    ]) {
      list.appendChild(changeMeasure(label, summary.verification, key));
    }
    vDetails.appendChild(list);
    vDetails.appendChild(el("p", "muted", "A skipped verification is never counted as a pass. Infrastructure failures describe the runner, not the website."));
  }
  vBox.appendChild(vDetails);
  c.appendChild(vBox);

  // ---- Coverage
  const cBox = el("div", "changegroup");
  const cDetails = el("details");
  const cSummary = el("summary");
  cSummary.appendChild(document.createTextNode("Coverage"));
  cDetails.appendChild(cSummary);
  if (summary.coverage && summary.coverage.available === false) {
    cDetails.appendChild(el("p", "muted", (summary.coverage.note || "Not compared.")));
  } else {
    const list = el("div", "list");
    for (const [label, key] of [
      ["Pages tested", "pagesTested"],
      ["Pages partially tested", "pagesPartial"],
      ["Pages untested", "pagesUntested"],
      ["Flows executed", "flowsExecuted"],
      ["Interactions tested", "interactionsTested"],
      ["Interactions partial", "interactionsPartial"],
      ["Interactions untested", "interactionsUntested"],
    ]) {
      list.appendChild(changeMeasure(label, summary.coverage, key));
    }
    cDetails.appendChild(list);
  }
  cBox.appendChild(cDetails);
  c.appendChild(cBox);

  // ---- Access
  const a = summary.access || {};
  const aBox = el("div", "changegroup");
  const aDetails = el("details");
  const aSummary = el("summary");
  aSummary.appendChild(document.createTextNode("Access"));
  aDetails.appendChild(aSummary);
  const aList = el("div", "list");
  const aLi = el("li", "measure");
  aLi.appendChild(el("span", "u", "Access state"));
  const aVals = el("span", "muted");
  aVals.appendChild(document.createTextNode(
    (a.previous || NOT_AVAILABLE) + " → " + (a.current || NOT_AVAILABLE) + (a.changed ? " (changed)" : " (unchanged)")
  ));
  aLi.appendChild(aVals);
  aList.appendChild(aLi);
  aDetails.appendChild(aList);
  aDetails.appendChild(el("p", "muted", a.note || ""));
  aBox.appendChild(aDetails);
  c.appendChild(aBox);

  // ---- Recommendations
  const r = summary.recommendations || {};
  if (r.available !== false && (arr(r.added).length || arr(r.removed).length)) {
    const rBox = el("div", "changegroup");
    const rDetails = el("details");
    const rSummary = el("summary");
    rSummary.appendChild(document.createTextNode("Recommendations (" + (arr(r.added).length + arr(r.removed).length) + ")"));
    rDetails.appendChild(rSummary);
    const list = el("div", "list");
    for (const rec of arr(r.added)) { const li = el("li"); const head = el("div", "runrow"); head.appendChild(el("span", "u", rec.name || rec.id)); head.appendChild(chip("added", changeTone("added"))); li.appendChild(head); list.appendChild(li); }
    for (const rec of arr(r.removed)) { const li = el("li"); const head = el("div", "runrow"); head.appendChild(el("span", "u", rec.name || rec.id)); head.appendChild(chip("removed", changeTone("removed"))); li.appendChild(head); list.appendChild(li); }
    rDetails.appendChild(list);
    rBox.appendChild(rDetails);
    c.appendChild(rBox);
  }

  c.appendChild(changeLinks(run, projectId));
  return c;
}

function flowItem(kind, flow) {
  const li = el("li");
  const head = el("div", "runrow");
  head.appendChild(el("span", "u", flow.title || flow.category || flow.id));
  head.appendChild(chip(kind, changeTone(kind)));
  li.appendChild(head);
  const meta = el("div", "muted");
  meta.appendChild(document.createTextNode(
    (flow.category ? flow.category + " · " : "") + (flow.startPage || "") + " · " + num(flow.count) + " flow(s) with this signature"
  ));
  li.appendChild(meta);
  return li;
}

function changeLinks(run, projectId) {
  const links = el("div", "links");
  if (projectId) links.appendChild(link("/api/projects/" + encodeURIComponent(projectId) + "/runs/" + encodeURIComponent(run.runId) + "/change-summary", "Change summary JSON"));
  if (projectId) links.appendChild(link("/projects/" + encodeURIComponent(projectId), "Project run history →"));
  return links;
}

function renderFindingsChanges(changes, run, projectId) {
  const counts = changes.counts || {};
  const c = section("Findings Changes", "changes", null, "Compared with the project's previous comparable run. These are counts of tracked findings, not a score.");
  const strip = el("div", "metrics");
  const cell = (label, value, tone) => {
    const m = el("div", "metric");
    m.appendChild(el("div", "v", String(value)));
    m.appendChild(el("div", "k", label));
    if (tone) m.classList.add("tone-" + tone);
    return m;
  };
  strip.appendChild(cell("New", counts.new || 0, "fail"));
  strip.appendChild(cell("Regressed", counts.regressed || 0, "fail"));
  strip.appendChild(cell("Resolved", counts.resolved || 0, "ok"));
  strip.appendChild(cell("Still active", counts.active || 0, "warn"));
  c.appendChild(strip);

  const group = (title, refs, tone) => {
    const items = arr(refs);
    const h = el("h3", "changesgroup", title + " (" + items.length + ")");
    c.appendChild(h);
    if (!items.length) {
      c.appendChild(el("p", "muted", "None recorded in this run."));
      return;
    }
    const list = el("div", "list");
    for (const ref of items) {
      const li = el("li");
      const head = el("div", "runrow");
      head.appendChild(el("span", "u", ref.title || ref.id));
      const tags = el("span");
      tags.appendChild(chip(ref.severity, ref.severity === "CRITICAL" || ref.severity === "HIGH" ? "fail" : "muted"));
      tags.appendChild(chip(LIFECYCLE_LABEL[ref.status] || ref.status, LIFECYCLE_CLASS[ref.status] || "muted"));
      head.appendChild(tags);
      li.appendChild(head);
      // Link straight into the existing evidence for this finding.
      if (ref.runFindingId) {
        const open = el("a", null, "Open evidence →");
        open.href = "/dashboard#/runs/" + encodeURIComponent(run.runId) + "/findings";
        li.appendChild(open);
      }
      if (projectId) {
        const tracked = el("a", null, "Tracked finding →");
        tracked.href = "/projects/" + encodeURIComponent(projectId);
        li.appendChild(tracked);
      }
      list.appendChild(li);
    }
    c.appendChild(list);
    if (tone) c.appendChild(el("p", "muted", tone));
  };

  group("New", changes.new);
  group("Regressed", changes.regressed, "A regressed finding had been resolved and has returned. This is a lifecycle event, separate from the regression gate's policy decision.");
  group("Resolved", changes.resolved, "Only findings whose area was meaningfully re-tested in this run are counted as resolved.");
  group("Still active", changes.active);

  const links = el("div", "links");
  if (projectId) links.appendChild(link("/projects/" + encodeURIComponent(projectId), "See every tracked finding for this project →"));
  links.appendChild(link("/api/projects/" + encodeURIComponent(projectId || "") + "/runs/" + encodeURIComponent(run.runId) + "/comparison", "Comparison JSON"));
  c.appendChild(links);
  return c;
}

function renderOverview(results, run) {
  const o = results.overview || {};
  const c = section("Results Overview", "overview");
  const verdict = el("div", "verdict");
  const badge = el("div", "status status-" + (o.status || "NOT_TESTED"), o.status || "NOT_TESTED");
  verdict.appendChild(badge);
  if (o.coverageStatement) verdict.appendChild(chip(o.coverageStatement, "info"));
  if (o.durationMs) verdict.appendChild(chip(formatMs(o.durationMs) + " scan time", "muted"));
  c.appendChild(verdict);
  c.appendChild(el("p", "explanation", o.statusExplanation || "No status explanation was recorded."));
  if (o.headline) c.appendChild(el("p", "headline", o.headline));

  const kv = el("dl", "kv");
  addKV(kv, "URL tested", o.url || run.url);
  if (o.finalUrl && o.finalUrl !== o.url) addKV(kv, "Final URL after redirects", o.finalUrl);
  addKV(kv, "Page title", o.title);
  addKV(kv, "Run id", o.runId);
  if (o.historyRunId) addKV(kv, "Persisted history run", o.historyRunId + (o.historyRunsAvailable != null ? " (" + o.historyRunsAvailable + " run(s) on record)" : ""));
  addKV(kv, "Scanned", formatTime(o.scannedAt));
  addKV(kv, "Report generated", formatTime(o.generatedAt));
  addKV(kv, "Engine mode", o.mode);
  if (o.aiProvider) addKV(kv, "AI provider", o.aiProvider);
  c.appendChild(kv);
  return c;
}

function renderAccess(access) {
  const c = el("div", "banner " + access.kind);
  c.id = "access";
  c.appendChild(el("div", "ico", access.kind === "ACCESS_BLOCKED" ? "\u26D4" : "\u26A0"));
  const body = el("div");
  body.appendChild(el("h3", null, access.headline));
  body.appendChild(el("p", null, access.message));
  const facts = [];
  if (access.httpStatus != null) facts.push("HTTP " + access.httpStatus);
  if (access.challenge) facts.push("Challenge: " + access.challenge);
  if (facts.length) body.appendChild(el("p", "muted", facts.join(" · ")));
  body.appendChild(el("p", "notdefect", access.impact));
  c.appendChild(body);
  return c;
}

function renderMetrics(results) {
  const wrap = el("div", "metrics");
  for (const metric of arr(results.metrics)) {
    const m = el("div", "metric");
    m.appendChild(el("div", "v", String(num(metric.value))));
    m.appendChild(el("div", "k", metric.label));
    wrap.appendChild(m);
  }
  return wrap;
}

// --- Findings (primary) ---
function renderFindings(results) {
  const f = results.findings || { items: [], total: 0, reproduced: 0, notReproduced: 0, passed: 0, reviewRequired: 0, unverified: 0 };
  const c = section("Findings", "findings", f.total ? String(f.total) : null,
    f.total ? "Ordered by severity. Reproduced findings are confirmed problems on the live page; the rest are discovered observations." : null);
  const summaryLine = el("div");
  summaryLine.appendChild(chip(f.reproduced + " reproduced", f.reproduced ? "fail" : "muted"));
  summaryLine.appendChild(chip(f.notReproduced + " not reproduced", "ok"));
  summaryLine.appendChild(chip(f.passed + " checked and clean", "ok"));
  summaryLine.appendChild(chip(f.reviewRequired + " need review", "warn"));
  summaryLine.appendChild(chip(f.unverified + " unverified", "muted"));
  c.appendChild(summaryLine);

  if (!f.items.length) {
    const empty = el("div", "empty");
    empty.appendChild(document.createTextNode((results.empty && results.empty.messages.findings) || "No findings were recorded for this run."));
    c.appendChild(empty);
    return c;
  }

  for (const item of f.items) c.appendChild(findingItem(item));
  return c;
}

function findingItem(item) {
  const status = item.verification ? item.verification.status : null;
  const disposition = item.verification ? item.verification.disposition : null;
  const tone = status === "REPRODUCED" ? "reproduced"
    : (status === "REVIEW" || disposition === "REVIEW_REQUIRED") ? "review"
    : (status === "NOT_REPRODUCED" || status === "PASS") ? "cleared"
    : "unverified";
  const d = el("details", "item finding " + tone);
  d.dataset.detailPath = item.detailPath;
  const s = el("summary");
  s.appendChild(severityChip(item.severity));
  const title = el("span", "t", (item.code ? item.code + " — " : "") + item.title);
  s.appendChild(title);
  if (status) s.appendChild(verdictChip(status));
  else if (disposition) s.appendChild(chip(disposition.replace(/_/g, " "), "muted"));
  if (num(item.occurrenceCount) > 1) s.appendChild(chip(item.occurrenceCount + " occurrences", "muted"));
  d.appendChild(s);
  d.appendChild(findingBody(item));
  return d;
}

function findingBody(item) {
  const body = el("div", "body");
  body.appendChild(el("p", null, item.headline));
  const kv = el("dl", "kv");
  addKV(kv, "Finding id", item.id);
  addKV(kv, "Domain", item.domain);
  addKV(kv, "Confidence", item.confidence);
  addKV(kv, "Lifecycle", item.lifecycle);
  addKV(kv, "Page", item.page);
  if (num(item.occurrenceCount) === 0) addKV(kv, "Evidence", "No element-level evidence was recorded for this finding.");
  body.appendChild(kv);
  const note = el("div", "loading");
  note.textContent = "Expand to load the full evidence for this finding.";
  body.appendChild(note);
  return body;
}

/** Lazy-loads the bounded finding detail view on first expand. */
async function loadFindingDetail(detailPath, body) {
  const note = body.querySelector(".loading");
  try {
    const res = await fetch(detailPath);
    const data = await res.json().catch(() => ({}));
    if (note) note.remove();
    if (!res.ok) {
      body.appendChild(el("p", "err", (data && data.error) || "The evidence for this finding could not be loaded."));
      return;
    }
    const finding = data.finding || {};
    if (finding.description) body.appendChild(labelled("What was found", finding.description));
    if (finding.rationale) body.appendChild(labelled("Why this was flagged", finding.rationale));
    if (finding.userImpact) body.appendChild(labelled("User impact", finding.userImpact));
    if (finding.recommendation) body.appendChild(labelled("Recommended fix", finding.recommendation));

    if (data.verification) {
      const v = data.verification;
      body.appendChild(el("h4", null, "Verification"));
      const line = el("div");
      line.appendChild(chip(v.disposition, VERDICT_CLASS[v.disposition] || "muted"));
      if (v.status) line.appendChild(verdictChip(v.status));
      if (v.category) line.appendChild(chip(v.category, "muted"));
      if (v.verdict) line.appendChild(chip(v.verdict, "info"));
      body.appendChild(line);
      if (v.reason) body.appendChild(el("p", null, v.reason));
      const vkv = el("dl", "kv");
      addKV(vkv, "Strategy", v.strategy);
      addKV(vkv, "Locator", v.locator);
      addKV(vkv, "Executed at", formatTime(v.executedAt));
      addKV(vkv, "Duration", formatMs(v.durationMs));
      if (v.error) addKV(vkv, "Error", v.error.type ? v.error.type + ": " + v.error.message : v.error.message);
      body.appendChild(vkv);
      const rows = arr(v.evidence);
      if (rows.length) {
        const ul = el("ul", "list");
        for (const r of rows) row(ul, r.label, r.value);
        body.appendChild(ul);
      }
    }

    const occurrences = arr(data.occurrences);
    if (occurrences.length) {
      body.appendChild(el("h4", null, "Evidence (" + occurrences.length + ")"));
      for (const occurrence of occurrences) {
        const d2 = el("details", "item");
        const s2 = el("summary");
        s2.appendChild(el("span", "t", occurrence.kind + (occurrence.selector ? " — " + occurrence.selector : "")));
        if (occurrence.tag) s2.appendChild(chip(occurrence.tag, "muted"));
        if (occurrence.visible === true) s2.appendChild(chip("visible", "ok"));
        if (occurrence.visible === false) s2.appendChild(chip("not visible", "muted"));
        d2.appendChild(s2);
        const b2 = el("div", "body");
        if (occurrence.note) b2.appendChild(el("p", "muted", occurrence.note));
        const ul = el("ul", "list");
        if (occurrence.accessibleName) row(ul, "Accessible name", occurrence.accessibleName);
        if (occurrence.role) row(ul, "Role", occurrence.role);
        if (occurrence.text) row(ul, "Text", occurrence.text);
        if (occurrence.href) row(ul, "Href", occurrence.href);
        if (occurrence.url) row(ul, "URL", occurrence.url);
        if (occurrence.alt) row(ul, "Alt", occurrence.alt);
        for (const d of arr(occurrence.detail)) row(ul, d.label, d.value);
        if (ul.childNodes.length) b2.appendChild(ul);
        d2.appendChild(b2);
        body.appendChild(d2);
      }
    }

    const rootCause = arr(data.rootCause);
    if (rootCause.length) {
      body.appendChild(el("h4", null, "Possible root cause"));
      for (const candidate of rootCause) {
        const p = el("p");
        p.appendChild(el("strong", null, candidate.title));
        p.appendChild(document.createTextNode(" · " + candidate.pattern + " · " + candidate.confidence));
        body.appendChild(p);
        if (candidate.description) body.appendChild(el("p", "muted", candidate.description));
      }
    }

    for (const noteText of arr(data.notes)) body.appendChild(el("p", "muted", noteText));
  } catch {
    if (note) note.remove();
    body.appendChild(el("p", "err", "The evidence for this finding could not be loaded."));
  }
}

// --- Verification ---
function renderVerification(results) {
  const v = results.verification || {};
  const c = section("Verification", "verification", null, "Every counter is a direct count from the run. Definitions state exactly what is included.");
  c.appendChild(el("p", null, v.headline || "No verification summary was recorded."));
  const ul = el("ul", "list");
  for (const counter of arr(v.counters)) {
    const li = row(ul, counter.label, counter.value);
    if (counter.detail) li.appendChild(el("div", "muted", counter.detail));
  }
  c.appendChild(ul);

  const verdicts = arr(v.verdicts);
  if (verdicts.length) {
    c.appendChild(el("h2", null, "Outcomes"));
    for (const outcome of verdicts) {
      const d = el("details", "item");
      const s = el("summary");
      s.appendChild(el("span", "t", outcome.findingTitle || outcome.findingId));
      if (outcome.status) s.appendChild(verdictChip(outcome.status));
      if (outcome.category) s.appendChild(chip(outcome.category, outcome.category === "WEBSITE" ? "fail" : "muted"));
      if (outcome.verdict) s.appendChild(chip(outcome.verdict, "info"));
      d.appendChild(s);
      const body = el("div", "body");
      if (outcome.reason) body.appendChild(el("p", null, outcome.reason));
      const kv = el("dl", "kv");
      addKV(kv, "Finding id", outcome.findingId);
      addKV(kv, "Locator", outcome.locator);
      addKV(kv, "Duration", formatMs(outcome.durationMs));
      if (outcome.error) addKV(kv, "Error", outcome.error.message);
      body.appendChild(kv);
      d.appendChild(body);
      c.appendChild(d);
    }
  } else if (v.emptyMessage) {
    c.appendChild(el("div", "empty", v.emptyMessage));
  }

  const infra = arr(v.infrastructureNotes);
  if (infra.length) {
    c.appendChild(el("h2", null, "Infrastructure problems (not website defects)"));
    const ul2 = el("ul", "list");
    for (const note of infra) ul2.appendChild(el("li", null, note));
    c.appendChild(ul2);
  }
  return c;
}

// --- Coverage overview ---
function renderCoverage(results) {
  const cov = results.coverage || {};
  const c = section("Coverage Overview", "coverage", null, "Discovered is not the same as tested. Anything not executed is listed under Not Tested or Review.");
  c.appendChild(el("p", null, cov.headline || "No coverage summary was recorded."));

  if (!arr(cov.groups).length) {
    c.appendChild(el("div", "empty", cov.emptyMessage || "No coverage data is available for this run."));

  }
  const cols = el("div", "cols");
