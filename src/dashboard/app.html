// --- Actionable gaps ---
function renderGaps(results) {
  const cov = results.coverage || {};
  const groups = arr(cov.gapGroups);
  const recs = arr(cov.recommendations);
  const c = section("What Was Not Tested", "gaps", groups.length || recs.length ? String(groups.reduce((t, g) => t + num(g.count), 0)) : null,
    "Each group states what is unconfirmed, why, and what it means for confidence in this result.");
  if (!groups.length && !recs.length) {
    const empty = el("div", "empty");
    empty.appendChild(document.createTextNode(cov.emptyMessage || "No untested or review-required area was recorded."));
    c.appendChild(empty);
    return c;
  }
  for (const group of groups) {
    const tone = group.kind === "blocked" ? "fail" : group.kind === "review" ? "warn" : "muted";
    const d = el("details", "item");
    const s = el("summary");
    s.appendChild(el("span", "t", group.title));
    s.appendChild(chip(group.kind.replace(/-/g, " "), tone));
    d.appendChild(s);
    const body = el("div", "body");
    body.appendChild(el("p", null, group.confidenceNote));
    if (arr(group.reasons).length) {
      body.appendChild(el("h4", null, "Reasons recorded by the engine"));
      const ul = el("ul", "list");
      for (const reason of group.reasons) ul.appendChild(el("li", null, reason));
      body.appendChild(ul);
    }
    const items = el("ul", "list");
    for (const item of arr(group.items)) {
      const li = el("li");
      const r = el("div", "runrow");
      r.appendChild(el("span", null, item.name));
      const right = el("div");
      right.appendChild(chip(item.category, "muted"));
      if (item.safety && item.safety !== "NOT_APPLICABLE") right.appendChild(chip(item.safety, item.safety === "SAFE" ? "muted" : "warn"));
      r.appendChild(right);
      li.appendChild(r);
      li.appendChild(el("div", "muted", item.reason + (item.url ? " · " + item.url : "")));
      items.appendChild(li);
    }
    body.appendChild(items);
    if (num(group.omitted) > 0) body.appendChild(el("p", "muted", "… and " + group.omitted + " more of this kind (full list in the HTML report)."));
    d.appendChild(body);
    c.appendChild(d);
  }

  if (recs.length) {
    c.appendChild(el("h2", null, "Recommended next steps"));
    for (const rec of recs) {
      const d = el("details", "item");
      const s = el("summary");
      s.appendChild(priorityChip(rec.priority));
      s.appendChild(el("span", "t", rec.title));
      d.appendChild(s);
      const body = el("div", "body");
      body.appendChild(el("p", null, rec.reason));
      if (rec.priorityReason) body.appendChild(labelled("Why this priority", rec.priorityReason));
      const kv = el("dl", "kv");
      addKV(kv, "Coverage items", arr(rec.coverageIds).join(", "));
      addKV(kv, "Related findings", arr(rec.relatedFindings).join(", "));
      body.appendChild(kv);
      d.appendChild(body);
      c.appendChild(d);
    }
  }
  return c;
}

// --- Flows ---
function renderFlows(results) {
  const flows = results.flows || {};
  const c = section("Test Flows", "flows", arr(flows.items).length ? String(arr(flows.items).length) : null,
    "Discovered user flows and what happened when they ran. A flow that was never executed is not a pass.");
  c.appendChild(el("p", null, flows.headline || "No flow summary was recorded."));
  if (arr(flows.counters).length) {
    const cols = el("div", "cols");
    const ul = el("ul", "list");
    for (const counter of arr(flows.counters)) row(ul, counter.label, counter.value);
    cols.appendChild(ul);
    c.appendChild(cols);
  }
  const items = arr(flows.items);
  if (!items.length) {
    c.appendChild(el("div", "empty", flows.emptyMessage || "No user flows were discovered for this run."));
    return c;
  }
  for (const flow of items) {
    const d = el("details", "item");
    const s = el("summary");
    s.appendChild(priorityChip(flow.priority));
    s.appendChild(el("span", "t", flow.title));
    s.appendChild(verdictChip(flow.status));
    if (flow.safety && flow.safety !== "SAFE") s.appendChild(chip(flow.safety, "warn"));
    d.appendChild(s);
    const body = el("div", "body");
    if (flow.description) body.appendChild(el("p", null, flow.description));
    const kv = el("dl", "kv");
    addKV(kv, "Flow id", flow.flowId);
    addKV(kv, "Category", flow.category);
    addKV(kv, "Start URL", flow.startUrl);
    addKV(kv, "Automation", flow.automation);
    addKV(kv, "Why this priority", flow.priorityReason);
    body.appendChild(kv);
    const reason = el("p", flow.status === "PASS" || flow.status === "REPRODUCED" ? null : "muted", flow.reason);
    body.appendChild(reason);
    const steps = arr(flow.steps);
    if (steps.length) {
      body.appendChild(el("h4", null, "Steps (" + steps.length + ")"));
      const ul = el("ul", "steps");
      for (const step of steps) {
        const li = el("li");
        const line = el("div", "runrow");
        line.appendChild(el("span", null, step.index + ". " + step.action + (step.targetUrl ? " " + step.targetUrl : "")));
        const right = el("div");
        if (step.outcome) right.appendChild(verdictChip(step.outcome));
        if (step.safety && step.safety !== "SAFE") right.appendChild(chip(step.safety, "warn"));
        line.appendChild(right);
        li.appendChild(line);
        li.appendChild(el("div", "muted", "Expected: " + (step.expected || "not recorded") + (step.locator ? " · " + step.locator : "")));
        if (step.reason) li.appendChild(el("div", "muted", step.reason));
        if (step.outcomeReason) li.appendChild(el("div", "muted", step.outcomeReason));
        if (step.error) li.appendChild(el("div", "err", step.error.message));
        ul.appendChild(li);
      }
      body.appendChild(ul);
    }
    d.appendChild(body);
    c.appendChild(d);
  }
  return c;
}

// Projects
//
// A project is a saved website. This page only organizes and links to real
// engine runs: it never computes a status, never re-runs QA, and never fills in
// a field the report did not produce.
// ---------------------------------------------------------------------------
const apiJson = async (path, options) => {
  const res = await fetch(path, options);
  return { status: res.status, ok: res.ok, body: await res.json().catch(() => ({})) };
};

// ---------------------------------------------------------------------------
// QA schedules
//
// A schedule only decides when a project is tested. Every result shown here
// comes from a run that really happened, and a slot that produced no run says
// so with its recorded reason rather than being hidden.
// ---------------------------------------------------------------------------
const SCHEDULE_EXECUTION_LABEL = {
  QUEUED: "Queued",
  RUNNING: "Running",
  COMPLETED: "Completed",
  FAILED: "Failed",
  SKIPPED_OVERLAPPING_RUN: "Skipped: run already in progress",
  SKIPPED_PROJECT_MISSING: "Skipped: project no longer exists",
  CANCELLED: "Cancelled",
  INTERRUPTED: "Interrupted",
};
const SCHEDULE_EXECUTION_CLASS = {
  QUEUED: "muted",
  RUNNING: "warn",
  COMPLETED: "ok",
  FAILED: "fail",
  SKIPPED_OVERLAPPING_RUN: "muted",
  SKIPPED_PROJECT_MISSING: "muted",
  CANCELLED: "muted",
  INTERRUPTED: "warn",
};

const schedulePath = (projectId) => "/api/projects/" + encodeURIComponent(projectId) + "/schedule";

const scheduleError = (node, message) => {
  node.textContent = message;
  node.className = "toast error show";
};

const scheduleClear = (node) => {
  node.textContent = "";
  node.className = "toast";
};

/** Timezone choices: the device zone, a fixed short list of common zones, and
 *  whatever the schedule already uses. The server validates whatever is sent. */
const COMMON_TIMEZONES = ["UTC", "Europe/Berlin", "Europe/London", "America/New_York", "America/Los_Angeles", "Asia/Tokyo", "Asia/Kolkata", "Australia/Sydney"];

const timezoneOptions = (selected) => {
  const frag = document.createDocumentFragment();
  const zones = [];
  for (const zone of browserTimezones()) zones.push([zone, zone + " (this device)"]);
  for (const zone of COMMON_TIMEZONES) if (!zones.some(entry => entry[0] === zone)) zones.push([zone, zone]);
  if (selected && !zones.some(entry => entry[0] === selected)) zones.unshift([selected, selected + " (current)"]);
  for (const [value, label] of zones) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    if (value === selected) option.selected = true;
    frag.appendChild(option);
  }
  return frag;
};

/** Every browser timezone, so a user is not limited to the short list. */
const browserTimezones = () => {
  try {
    const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return zone ? [zone] : [];
  } catch { return []; }
};

/**
 * Builds the QA Schedule card for one project, plus its Scheduled Runs history.
 * Reloading is the whole refresh story: the card re-reads the persisted schedule
 * rather than holding its own copy of the state.
 */
function scheduleSection(projectId, schedule, toast, openRun) {
  const section = el("div");
  section.id = "project-schedule";
  const shell = card("QA Schedule");
  section.appendChild(shell);
  section.dataset.projectId = projectId;

  const FREQUENCIES = [
    ["EVERY_15_MINUTES", "Every 15 minutes"],
    ["HOURLY", "Hourly"],
    ["EVERY_6_HOURS", "Every 6 hours"],
    ["DAILY", "Daily"],
    ["WEEKLY", "Weekly"],
  ];

  const controls = el("div", "runbar");
  const freqField = el("div", "field");
  const freqLabel = el("label", null, "Frequency"); freqLabel.setAttribute("for", "schedule-frequency-" + projectId);
  const freqInput = el("select", "input"); freqInput.id = "schedule-frequency-" + projectId;
  for (const [value, label] of FREQUENCIES) {
    const option = el("option", null, label);
    option.value = value;
    freqInput.appendChild(option);
  }
  freqField.appendChild(freqLabel);
  freqField.appendChild(freqInput);

  const zoneField = el("div", "field");
  const zoneLabel = el("label", null, "Timezone"); zoneLabel.setAttribute("for", "schedule-timezone-" + projectId);
  const zoneInput = el("select", "input"); zoneInput.id = "schedule-timezone-" + projectId;
  // The full choice list is always present: the device zone is highlighted, the
  // common zones stay available, and a schedule saved in any other IANA zone
  // still appears as a selectable option.
  const fillZones = (selected) => {
    zoneInput.innerHTML = "";
    zoneInput.appendChild(timezoneOptions(selected));
  };
  fillZones(schedule ? schedule.timezone : null);
  zoneField.appendChild(zoneLabel);
  zoneField.appendChild(zoneInput);

  const save = el("button", "btn", schedule ? "Save schedule" : "Create schedule"); save.type = "button"; save.id = "schedule-save-btn";
  controls.appendChild(freqField);
  controls.appendChild(zoneField);
  controls.appendChild(save);
  shell.appendChild(controls);

  if (!schedule) {
    shell.appendChild(el("p", "muted", "This project has no QA schedule. Creating one tests this website automatically on the frequency you choose."));
  }

  const state = el("div");
  shell.appendChild(state);
  const historyCard = card("Scheduled Runs");
  const historyHost = el("div");
  historyCard.appendChild(historyHost);

  const draw = (current) => {
    // Rebuilt every draw so the saved zone is always present and selectable.
    fillZones(current ? current.timezone : null);
    freqInput.value = current ? current.frequency : "DAILY";
    zoneInput.value = current ? current.timezone : (browserTimezones()[0] || "UTC");

    state.innerHTML = "";
    if (!current) {
      const dl = el("dl", "kv");
      addKV(dl, "Status", "Not scheduled");
      addKV(dl, "Next run", NOT_AVAILABLE);
      state.appendChild(dl);
      return;
    }
    const dl = el("dl", "kv");
    addKV(dl, "Status", current.enabled ? "Enabled" : "Disabled");
    addKV(dl, "Frequency", current.frequencyLabel || current.frequency);
    addKV(dl, "Timezone", current.timezone);
    addKV(dl, "Next run", current.enabled ? (formatTime(current.nextRunAt) || current.nextRunAt || NOT_AVAILABLE) : NOT_AVAILABLE);
    addKV(dl, "Last run", formatTime(current.lastRunAt) || NOT_AVAILABLE);
    addKV(dl, "Last status", current.lastExecutionStatus ? (SCHEDULE_EXECUTION_LABEL[current.lastExecutionStatus] || current.lastExecutionStatus) : NOT_AVAILABLE);
    addKV(dl, "Consecutive failures", current.consecutiveFailures == null ? NOT_AVAILABLE : String(current.consecutiveFailures));
    state.appendChild(dl);

    const actions = el("div", "links");
    const toggle = el("button", "btn secondary", current.enabled ? "Disable" : "Enable");
    toggle.type = "button";
    toggle.dataset.scheduleToggle = current.enabled ? "disable" : "enable";
    actions.appendChild(toggle);
    if (current.enabled) {
      const runNow = el("button", "btn secondary", "Run now"); runNow.type = "button";
      runNow.dataset.scheduleRunNow = "1";
      runNow.title = "Runs this schedule immediately through the same path a timed run takes.";
      actions.appendChild(runNow);
    }
    actions.appendChild(link("/api/projects/" + encodeURIComponent(projectId) + "/schedule/history", "History JSON"));
    state.appendChild(actions);

    toggle.addEventListener("click", async () => {
      scheduleClear(toast);
      const action = toggle.dataset.scheduleToggle;
      const res = await apiJson(schedulePath(projectId) + "/" + action, { method: "POST" });
      if (!res.ok) { scheduleError(toast, (res.body && res.body.error) || "Could not change the schedule."); return; }
      section.replaceWith(scheduleSection(projectId, res.body.schedule, toast, openRun));
    });
    const runNowBtn = actions.querySelector("[data-schedule-run-now]");
    if (runNowBtn) {
      runNowBtn.addEventListener("click", async () => {
        scheduleClear(toast);
        const res = await apiJson(schedulePath(projectId) + "/run-now", { method: "POST" });
        if (!res.ok) { scheduleError(toast, (res.body && res.body.error) || "Could not start the scheduled run."); return; }
        await loadHistory();
        openRun(res.body.execution.runId);
      });
    }
  };

  save.addEventListener("click", async () => {
    scheduleClear(toast);
    const res = await apiJson(schedulePath(projectId), {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ frequency: freqInput.value, timezone: zoneInput.value, enabled: true }),
    });
    if (!res.ok) { scheduleError(toast, (res.body && res.body.error) || "Could not save the schedule."); return; }
    section.replaceWith(scheduleSection(projectId, res.body.schedule, toast, openRun));
  });

  const loadHistory = async () => {
    if (!schedule) { historyHost.innerHTML = ""; return; }
    historyHost.innerHTML = "";
    const { ok, body } = await apiJson(schedulePath(projectId) + "/history");

// ---------------------------------------------------------------------------
// Project email settings
//
// Configures who a project emails and which events it emails about. It reads and
// writes the project's persisted settings and nothing else: this section never
// starts a run, never touches findings, schedules or history, and never sends
// mail of its own accord. The only button that can send anything is the explicit
// test email, which goes to the configured recipients through the same transport
// a real alert would use.
//
// The event checkboxes are rendered from the API's canonical list, so this file
// carries no second copy of the event taxonomy that could drift from the
// backend. If the load fails, nothing is shown as configured: an unreachable API
// must never look like saved settings.
// ---------------------------------------------------------------------------

/**
 * The event order used when a checkbox is ticked.
 *
 * Sourced from the loaded `eventOptions` so it always matches the backend's
 * canonical order, including any type added later.
 */
let NOTIFICATION_EVENT_ORDER = [];

const emailSettingsPath = (projectId) => "/api/projects/" + encodeURIComponent(projectId) + "/email-settings";

/**
 * Normalizes a typed address for comparison and submission.
 *
 * Mirrors the backend's rule closely enough to catch obvious mistakes inline,
 * but the SERVER is the authority: every save is validated again on the way in,
 * so a client that is slightly out of date cannot persist a bad address.
 */
const normalizeTypedEmail = (value) => {
  const trimmed = String(value == null ? "" : value).trim();
  if (!trimmed || trimmed.length > 254) return null;
  const lower = trimmed.toLowerCase();
  if (/[\s,;<>"']/.test(lower)) return null;
  const at = lower.indexOf("@");
  if (at <= 0 || at !== lower.lastIndexOf("@") || at === lower.length - 1) return null;
  if (lower.indexOf("..") !== -1) return null;
  const domain = lower.slice(at + 1);
  // Rejects an empty or hyphen-led domain label, which no mail server accepts.
  if (!domain || domain.charAt(0) === "-" || domain.charAt(domain.length - 1) === "-") return null;
  return lower;
};

const emailStatusCell = (label, value, tone) => {
  const cell = el("div", "metric");
  const v = el("div", "v", value);
  if (tone) v.style.color = "var(--" + tone + ")";
  cell.appendChild(v);
  cell.appendChild(el("div", "k", label));
  return cell;
};

function emailSettingsSection(projectId) {
  const wrapper = el("div");
  wrapper.id = "project-email-settings";
  wrapper.dataset.projectId = projectId;

  const shell = card("Email Notifications");
  wrapper.appendChild(shell);
  shell.appendChild(el("p", "lede", "Email selected notification events to this project's recipients. Saving settings does not send anything."));

  let events = [];
  let missingSmtp = [];
  let state = { enabled: false, recipients: [], events: [] };
  let smtpConfigured = false;

  // --- Enable / disable ----------------------------------------------------------
  const toggleRow = el("div", "toggle-row");
  const toggleLabel = el("label");
  const toggle = el("input"); toggle.type = "checkbox"; toggle.id = "email-enabled-" + projectId;
  toggleLabel.appendChild(toggle);
  toggleLabel.appendChild(el("span", null, "Email notifications"));
  const toggleState = el("span", "toggle-state off", "OFF");
  toggleRow.appendChild(toggleLabel);
  toggleRow.appendChild(toggleState);
  shell.appendChild(toggleRow);

  const strip = el("div", "metrics");
  shell.appendChild(strip);

  const smtpBanner = el("div", "banner UNKNOWN");
  smtpBanner.hidden = true;
  shell.appendChild(smtpBanner);

  // --- Recipients ----------------------------------------------------------------
  const recipientFieldset = el("fieldset");
  recipientFieldset.appendChild(el("legend", null, "Email recipients"));
  const recipientList = el("div", "recipients");
  recipientFieldset.appendChild(recipientList);

  const addRow = el("div", "runbar");
  const addField = el("div", "field");
  const addLabel = el("label", null, "Add recipient");
  addLabel.setAttribute("for", "email-recipient-" + projectId);
  const addInput = el("input", "input");
  addInput.id = "email-recipient-" + projectId;
  addInput.type = "email";
  addInput.placeholder = "qa@example.com";
  addInput.autocomplete = "off";
  addInput.setAttribute("aria-describedby", "email-recipient-error-" + projectId);
  addField.appendChild(addLabel);
  addField.appendChild(addInput);
  const addError = el("div", "fielderror");
  addError.id = "email-recipient-error-" + projectId;
  addError.setAttribute("role", "alert");
  addField.appendChild(addError);
  const addBtn = el("button", "btn", "Add recipient"); addBtn.type = "button";
  addRow.appendChild(addField);
  addRow.appendChild(addBtn);
  recipientFieldset.appendChild(addRow);
  shell.appendChild(recipientFieldset);

  // --- Events --------------------------------------------------------------------
  const eventFieldset = el("fieldset");
  eventFieldset.appendChild(el("legend", null, "Notification events"));
  const eventList = el("div", "eventlist");
  eventFieldset.appendChild(eventList);
  shell.appendChild(eventFieldset);

  // --- Actions -------------------------------------------------------------------
  const actions = el("div", "links");
  const saveBtn = el("button", "btn", "Save settings");
  saveBtn.type = "button"; saveBtn.id = "email-save-btn";
  const testBtn = el("button", "btn secondary", "Send test email");
  testBtn.type = "button"; testBtn.id = "email-test-btn";
  actions.appendChild(saveBtn);
  actions.appendChild(testBtn);
  shell.appendChild(actions);
  shell.appendChild(el("p", "hint", "A test email confirms delivery only. It is not a QA notification and does not appear in the notification history."));

  const status = el("div", "toast");
  status.id = "email-status";
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");
  shell.appendChild(status);

  const say = (message, tone) => {
    status.className = "toast" + (tone ? " " + tone : "");
    status.textContent = message || "";
    if (message) status.classList.add("show");
  };

  // --- Render --------------------------------------------------------------------
  const renderStrip = () => {
    strip.innerHTML = "";
    strip.appendChild(emailStatusCell("Email notifications", state.enabled ? "Enabled" : "Disabled", state.enabled ? "ok" : null));
    strip.appendChild(emailStatusCell("Recipients", state.recipients.length + " configured"));
    strip.appendChild(emailStatusCell("Events", state.events.length + " selected"));
    strip.appendChild(emailStatusCell("SMTP", smtpConfigured ? "Configured" : "Not configured", smtpConfigured ? "ok" : "warn"));
  };

  const renderSmtpBanner = () => {
    smtpBanner.hidden = smtpConfigured;
    if (smtpConfigured) return;
    smtpBanner.innerHTML = "";
    // Only the NAMES of missing variables. The dashboard is never shown SMTP
    // connection details or credentials, because the API never returns them.
    smtpBanner.appendChild(el("span", "ico", "!"));
    const box = el("div");
    box.appendChild(el("h3", null, "SMTP not configured"));
    box.appendChild(el("p", null, "Settings can still be saved, but no email can be sent until SMTP is configured on the server."));
    if (missingSmtp.length) box.appendChild(el("p", "notdefect", "Missing: " + missingSmtp.join(", ")));
    smtpBanner.appendChild(box);
  };

  const renderRecipients = () => {
    recipientList.innerHTML = "";
    for (const address of state.recipients) {
      const row = el("div", "recipientrow");
      row.appendChild(el("span", "addr", address));
      const remove = el("button", "btn secondary danger", "Remove");
      remove.type = "button";
      // The accessible name names the address, so several identical-looking
      // "Remove" buttons stay distinguishable to a screen reader.
      remove.setAttribute("aria-label", "Remove " + address);
      remove.addEventListener("click", () => {
        state.recipients = state.recipients.filter(entry => entry !== address);
        renderRecipients();
        renderStrip();
        say("Recipient removed. Select Save settings to keep this change.");
      });
      row.appendChild(remove);
      recipientList.appendChild(row);
    }
  };

  const renderEvents = () => {
    eventList.innerHTML = "";
    for (const option of events) {
      const id = "email-event-" + option.type + "-" + projectId;
      const label = el("label");
      label.setAttribute("for", id);
      const box = el("input");
      box.type = "checkbox";
      box.id = id;
      box.value = option.type;
      box.checked = state.events.indexOf(option.type) !== -1;
      box.addEventListener("change", () => {
        // Ticking keeps canonical order; unticking just drops the type.
        state.events = box.checked
          ? NOTIFICATION_EVENT_ORDER.filter(type => type === option.type || state.events.indexOf(type) !== -1)
          : state.events.filter(type => type !== option.type);
        renderStrip();
      });
      const text = el("span");
      text.appendChild(el("span", "t", option.label));
      text.appendChild(el("span", "d", option.description));
      label.appendChild(box);
      label.appendChild(text);
      eventList.appendChild(label);
    }
  };

  // Recipients and events only apply while email is on, so they are hidden when
  // it is off rather than shown as controls that would do nothing.
  const renderEnabled = () => {
    toggle.checked = state.enabled;
    toggleState.textContent = state.enabled ? "ON" : "OFF";
    toggleState.className = "toggle-state " + (state.enabled ? "on" : "off");
    recipientFieldset.hidden = !state.enabled;
    eventFieldset.hidden = !state.enabled;
    testBtn.disabled = !state.enabled;
    renderStrip();
  };

  const draw = () => {
    renderEnabled();
    renderRecipients();
    renderEvents();
    renderSmtpBanner();
  };

  // --- Behaviour -----------------------------------------------------------------
  toggle.addEventListener("change", () => {
    state.enabled = toggle.checked;
    renderEnabled();
    say("Select Save settings to keep this change.");
  });

  const addRecipient = () => {
    const normalized = normalizeTypedEmail(addInput.value);
    if (!normalized) {
      // Associated with the input through aria-describedby and announced, so the
      // error is never colour-only.
      addError.textContent = "Enter a valid email address.";
      addInput.setAttribute("aria-invalid", "true");
      addInput.focus();
      return;
    }
    if (state.recipients.indexOf(normalized) !== -1) {
      addError.textContent = normalized + " is already a recipient.";
      addInput.setAttribute("aria-invalid", "true");
      return;
    }
    addError.textContent = "";
    addInput.removeAttribute("aria-invalid");
    state.recipients = state.recipients.concat([normalized]).sort();
    addInput.value = "";
    renderRecipients();
    renderStrip();
    say("Recipient added. Select Save settings to keep this change.");
  };

  addBtn.addEventListener("click", addRecipient);
  // Enter in the address field adds a recipient instead of doing nothing.
  addInput.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addRecipient(); }
  });

  saveBtn.addEventListener("click", () => {
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    say("Saving...");
    // Nothing is reported as saved until the API has confirmed it.
    apiJson(emailSettingsPath(projectId), {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ enabled: state.enabled, recipients: state.recipients, events: state.events }),
    }).then(res => {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save settings";
      if (!res.ok || !res.body || !res.body.settings) {
        say((res.body && res.body.error) || "Those settings could not be saved.", "error");
        return;
      }
      // The server's normalized values win, so what is on screen afterwards is
      // exactly what was persisted rather than what was typed.
      state = {
        enabled: Boolean(res.body.settings.enabled),
        recipients: arr(res.body.settings.recipients),
        events: arr(res.body.settings.events),
      };
      smtpConfigured = Boolean(res.body.emailConfigured);
      draw();
      say("Saved", "ok");
    }).catch(() => {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save settings";
      say("Those settings could not be saved.", "error");
    });
  });

  testBtn.addEventListener("click", () => {
    testBtn.disabled = true;
    const previous = testBtn.textContent;
    testBtn.textContent = "Sending...";
    apiJson(emailSettingsPath(projectId) + "/test", { method: "POST" }).then(res => {
      testBtn.disabled = false;
      testBtn.textContent = previous;
      const body = res.body || {};
      if (res.ok && body.ok) {
        say(body.message || "Email sent successfully.", "ok");
        return;
      }
      // The backend owns this wording, so the screen can never show a raw SMTP
      // message or anything the server chose not to return.
      say(body.error || "Email could not be sent.", "error");
    }).catch(() => {
      testBtn.disabled = false;
      testBtn.textContent = previous;
      say("Email could not be sent. Check the email configuration and try again.", "error");
    });
  });

  // --- Load, once ----------------------------------------------------------------
  apiJson(emailSettingsPath(projectId)).then(res => {
    if (!res.ok || !res.body || !res.body.settings) {
      // An API that cannot be reached leaves an explicit error state. It never
      // falls back to a plausible-looking empty configuration.
      shell.innerHTML = "";
      shell.appendChild(el("h2", null, "Email Notifications"));
      shell.appendChild(el("p", "err", (res.body && res.body.error) || "Email settings could not be loaded."));
      return;
    }
    events = arr(res.body.eventOptions);
    // Canonical order comes from the API, so it cannot drift from the backend.
    NOTIFICATION_EVENT_ORDER = events.map(option => option.type);
    state = {
      enabled: Boolean(res.body.settings.enabled),
      recipients: arr(res.body.settings.recipients),
      events: NOTIFICATION_EVENT_ORDER.filter(type => arr(res.body.settings.events).indexOf(type) !== -1),
    };
    smtpConfigured = Boolean(res.body.emailConfigured);
    missingSmtp = arr(res.body.missingSmtpVariables);
    draw();
  });

  return wrapper;
}

async function renderProjectPage(mount, projectId) {
  const { ok, body } = await apiJson("/api/projects/" + encodeURIComponent(projectId));
  if (!ok) {
    mount.appendChild(el("p", "err", (body && body.error) || "That project could not be found."));
    const back = el("a", null, "← All projects");
    back.href = "/projects";
    back.addEventListener("click", e => { e.preventDefault(); navigate("/projects"); });
    mount.appendChild(back);
    return;
  }
  const project = body.project;
  const runs = arr(body.runs);
  // Per-run lifecycle counts recorded by the engine, for the history table.
  let findingSummaries = arr(body.findings);
  // Per-run run-to-run change records, for the history table and Latest Changes.
  let changeRecords = arr(body.changes);

  const header = el("div", "card");
  const h = el("h2", null, project.name);
  header.appendChild(h);
  header.appendChild(el("code", "projecturl", project.url));
  const actions = el("div", "links");
  const runBtn = el("button", "btn", "Run QA"); runBtn.type = "button";
  runBtn.dataset.runBtn = "1"; runBtn.dataset.runLabel = "Run QA"; runBtn.id = "project-run-btn";
  const toast = el("div", "toast"); toast.id = "toast";
  const all = el("div");
  all.appendChild(runBtn); all.appendChild(toast);
  actions.appendChild(all);
  const back = el("a", null, "← All projects");
  back.href = "/projects";
  back.addEventListener("click", e => { e.preventDefault(); navigate("/projects"); });
  actions.appendChild(back);
  header.appendChild(actions);
  mount.appendChild(header);

  // Live tracker + results live here while a project run is in flight.
  const runPanel = el("div"); runPanel.id = "run-panel"; mount.appendChild(runPanel);
  const resultPanel = el("div"); resultPanel.id = "result-panel"; mount.appendChild(resultPanel);

  // QA schedule + its history. Reads only from the persisted schedule document.
  const scheduleMount = el("div"); scheduleMount.id = "project-schedule-mount";
  mount.appendChild(scheduleMount);

  // Email notification settings. Configuration only - it reads and writes the
  // project's own email settings and sends nothing on its own.
  const emailMount = el("div"); emailMount.id = "project-email-mount";
  mount.appendChild(emailMount);
  emailMount.appendChild(emailSettingsSection(projectId));
  const openScheduledRun = runId => {
    if (runId) openHistoricalRun(runId, runPanel, resultPanel);
  };
  const loadSchedule = async () => {
    scheduleMount.innerHTML = "";
    const { ok, body } = await apiJson("/api/projects/" + encodeURIComponent(projectId) + "/schedule");
    if (!ok) {
      scheduleMount.appendChild(el("p", "err", (body && body.error) || "The QA schedule could not be loaded."));
      return;
    }
    scheduleMount.appendChild(scheduleSection(projectId, body.schedule, toast, openScheduledRun));
  };

  const summaryMount = el("div"); summaryMount.id = "project-summary";
  mount.appendChild(summaryMount);

  const buildSummary = () => {
    summaryMount.innerHTML = "";
    const latest = card("Latest result");
    const dl = el("dl", "kv");
    addKV(dl, "Status", project.lastStatus || NOT_AVAILABLE);
    addKV(dl, "Last run", formatTime(project.lastRunAt) || NOT_AVAILABLE);
    addKV(dl, "Findings", project.lastFindingsCount == null ? NOT_AVAILABLE : String(project.lastFindingsCount));
    addKV(dl, "Coverage", project.lastCoverageStatus || NOT_AVAILABLE);
    const lastRun = runs.find(run => run.runId === project.lastRunId);
    if (lastRun && lastRun.completedAt && lastRun.startedAt) {
      addKV(dl, "Duration", formatMs(new Date(lastRun.completedAt).getTime() - new Date(lastRun.startedAt).getTime()) || NOT_AVAILABLE);
    } else {
      addKV(dl, "Duration", NOT_AVAILABLE);
    }
    addKV(dl, "Run id", project.lastRunId || NOT_AVAILABLE);
    latest.appendChild(dl);
    if (project.lastStatus) latest.appendChild(el("div", "status status-" + project.lastStatus, project.lastStatus));
    if (project.lastRunId) {
      const links = el("div", "links");
      const openLatest = el("button", "btn secondary", "Open latest result"); openLatest.type = "button";
      openLatest.addEventListener("click", () => openHistoricalRun(project.lastRunId, runPanel, resultPanel));
      links.appendChild(openLatest);
      latest.appendChild(links);
    }
    summaryMount.appendChild(latest);

    // Latest Changes: a compact, honest account of what the most recent run
    // changed relative to the run before it. Every line is a recorded count, and
    // "no comparison available" is stated as itself rather than left blank.
    const latestChange = changeRecords.length ? changeRecords[0] : null;
    const changesCard = card("Latest Changes");
    if (!latestChange) {
      changesCard.appendChild(el("p", "muted", "No run-to-run comparison is available yet. A comparison needs two completed runs with readable reports."));
    } else if (latestChange.availability === "UNAVAILABLE") {
      const reason = el("p", "muted");
      reason.appendChild(chip(latestChange.reason || "INSUFFICIENT_EVIDENCE", "muted"));
      reason.appendChild(document.createTextNode(" " + (CHANGE_REASON_TEXT[latestChange.reason] || "Comparison unavailable") + "."));
      changesCard.appendChild(reason);
      if (latestChange.previousRunId) changesCard.appendChild(el("p", "muted", "Compared with run " + latestChange.previousRunId + "."));
    } else {
      const lines = arr(latestChange.highlights);
      if (latestChange.availability === "PARTIAL") {
        const partial = el("p", "muted");
        partial.appendChild(chip(latestChange.reason || "ACCESS_BOUNDARY", "warn"));
        partial.appendChild(document.createTextNode(" Only the access transition is reported for this pair of runs."));
        changesCard.appendChild(partial);
      }
      changesCard.appendChild(el("p", "muted", "Compared with run " + (latestChange.previousRunId || NOT_AVAILABLE) + "."));
      if (!lines.length) {
        changesCard.appendChild(el("p", "nochange", "No material changes detected between the comparable runs."));
      } else {
        const list = el("div", "list");
        for (const line of lines) list.appendChild(el("li", null, line));
        changesCard.appendChild(list);
      }
      const viewFull = el("button", "btn secondary", "View full comparison"); viewFull.type = "button";
      viewFull.addEventListener("click", () => openHistoricalRun(latestChange.currentRunId, runPanel, resultPanel));
      const viewLinks = el("div", "links");
      viewLinks.appendChild(viewFull);
      changesCard.appendChild(viewLinks);
    }
    summaryMount.appendChild(changesCard);

    const historyCard = card("Run history");
    if (!runs.length) {
      historyCard.appendChild(el("div", "empty", "No runs yet. Use Run QA above to test this website."));
    } else {
      // Each run's lifecycle counts come only from a recorded snapshot. A run
      // with no comparable predecessor shows "not available" rather than zeros.
      const summaryOf = runId => findingSummaries.find(item => item.runId === runId) || null;
      // The same rule for the change record: a run with no recorded comparison
      // has nothing to report, and the column says so instead of showing 0.
      const changeOf = runId => changeRecords.find(item => item.currentRunId === runId) || null;
      const table = el("table", "runstable");
      const thead = el("thead");
      const hr = el("tr");
      for (const heading of ["Date", "Status", "Findings", "New", "Resolved", "Regressed", "Active", "Pages", "Flows", "Coverage", "Run"]) hr.appendChild(el("th", null, heading));
      thead.appendChild(hr);
      table.appendChild(thead);
      const tbody = el("tbody");
      for (const run of runs) {
        const tr = el("tr");
        tr.appendChild(el("td", null, formatTime(run.startedAt) || run.startedAt));
        const statusCell = el("td");
        if (run.status) statusCell.appendChild(statusChip(run.status));
        else statusCell.appendChild(chip(run.state === "FAILED" ? "Run failed" : run.state, run.state === "FAILED" ? "fail" : "warn"));
        tr.appendChild(statusCell);
        tr.appendChild(el("td", null, run.findingsCount == null ? NOT_AVAILABLE : String(run.findingsCount)));
        const summary = summaryOf(run.runId);
        const available = Boolean(summary && summary.comparisonAvailable);
        const count = key => {
          if (!summary) return NOT_AVAILABLE;
          if (!available) return NOT_AVAILABLE;
          return String((summary.counts && summary.counts[key] != null ? summary.counts[key] : 0));
        };
        tr.appendChild(el("td", "c-new", count("new")));
        tr.appendChild(el("td", "c-resolved", count("resolved")));
        tr.appendChild(el("td", "c-regressed", count("regressed")));
        tr.appendChild(el("td", "c-active", count("active")));
        // Page and flow changes, only where a valid comparison was recorded.
        const change = changeOf(run.runId);
        const changeAvailable = Boolean(change && (change.availability === "AVAILABLE" || change.availability === "PARTIAL"));
        tr.appendChild(el("td", null, !changeAvailable ? NOT_AVAILABLE : (change.pagesAdded + change.pagesRemoved ? "+" + change.pagesAdded + " / −" + change.pagesRemoved : "0")));
        const flowTotal = changeAvailable ? change.flowsAdded + change.flowsRemoved + change.flowStatusChanges.length : null;
        tr.appendChild(el("td", null, flowTotal == null ? NOT_AVAILABLE : String(flowTotal)));
        tr.appendChild(el("td", null, run.coverageStatus || NOT_AVAILABLE));
        const runCell = el("td");
        if (run.hasResult) {
          const open = el("button", "btn secondary", "Open results"); open.type = "button";
          open.addEventListener("click", () => openHistoricalRun(run.runId, runPanel, resultPanel));
          runCell.appendChild(open);
        } else {
          runCell.appendChild(el("span", "muted", run.error ? "No report was written" : NOT_AVAILABLE));
        }
        tr.appendChild(runCell);
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      historyCard.appendChild(table);
      const note = el("p", "muted", "New, Resolved, Regressed and Active count tracked findings against the project's previous comparable run. Pages and Flows show what changed in the pages and flows discovered by each run. A first run has nothing to compare, so those columns are not available.");
      historyCard.appendChild(note);
    }
    summaryMount.appendChild(historyCard);
  };

  // -------------------------------------------------------------------------
  // Tracked findings
  // -------------------------------------------------------------------------
  const findingsMount = el("div"); findingsMount.id = "project-findings";
  mount.appendChild(findingsMount);

  const LIFECYCLE_BUCKETS = [
    ["REGRESSED", "Regressed", "fail"],
    ["NEW", "New", "fail"],
    ["ACTIVE", "Still active", "warn"],
    ["RESOLVED", "Recently resolved", "ok"],
  ];

  const findingRow = item => {
    const li = el("li");
    const head = el("div", "runrow");
    head.appendChild(el("span", "u", item.title || item.id));
    const tags = el("span");
    tags.appendChild(chip(item.severity, item.severity === "CRITICAL" || item.severity === "HIGH" ? "fail" : "muted"));
    tags.appendChild(chip(LIFECYCLE_LABEL[item.status] || item.status, LIFECYCLE_CLASS[item.status] || "muted"));
    head.appendChild(tags);
    li.appendChild(head);
    const meta = el("div", "muted");
    meta.appendChild(document.createTextNode(
      "First seen " + (formatTime(item.firstSeenAt) || item.firstSeenAt || NOT_AVAILABLE)
      + " · last seen " + (formatTime(item.lastSeenAt) || item.lastSeenAt || NOT_AVAILABLE)
      + " · seen in " + (item.occurrenceCount == null ? NOT_AVAILABLE : String(item.occurrenceCount)) + " run(s)"
      + (item.code ? " · " + item.code : "")
    ));
    li.appendChild(meta);
    const links = el("div", "links");
    if (item.lastSeenRunId) {
      const openRun = el("button", "btn secondary", "Open run"); openRun.type = "button";
      openRun.addEventListener("click", () => openHistoricalRun(item.lastSeenRunId, runPanel, resultPanel));
      links.appendChild(openRun);
    }
    links.appendChild(link("/api/projects/" + encodeURIComponent(projectId) + "/findings/" + encodeURIComponent(item.id) + "/history", "Lifecycle history"));
    li.appendChild(links);
    return li;
  };

  const loadFindings = async (query) => {
    findingsMount.innerHTML = "";
    const shell = card("Tracked findings");
    shell.appendChild(el("p", "muted", "Findings this project keeps across runs, matched by semantic identity rather than by run-local numbering. No score or ranking is attached."));
    const filters = el("div", "filters");
    const statusInput = el("select");
    const blank = el("option", null, "All lifecycle states"); blank.value = "";
    statusInput.appendChild(blank);
    for (const value of ["NEW", "ACTIVE", "REGRESSED", "RESOLVED"]) statusInput.appendChild(el("option", null, LIFECYCLE_LABEL[value] || value));
    const severityInput = el("select");
    const sblank = el("option", null, "All severities"); sblank.value = "";
    severityInput.appendChild(sblank);
    for (const value of ["CRITICAL", "HIGH", "MEDIUM", "LOW"]) severityInput.appendChild(el("option", null, value));
    const searchInput = el("input"); searchInput.type = "search"; searchInput.placeholder = "Search tracked findings";
    const apply = el("button", "btn secondary", "Apply filters"); apply.type = "button";
    statusInput.value = (query && query.status) || "";
    severityInput.value = (query && query.severity) || "";
    searchInput.value = (query && query.search) || "";
    const submit = () => {
      const params = new URLSearchParams();
      if (statusInput.value) params.set("status", statusInput.value);
      if (severityInput.value) params.set("severity", severityInput.value);
      if (searchInput.value.trim()) params.set("search", searchInput.value.trim());
      loadFindings(params.toString());
    };
    apply.addEventListener("click", submit);
    filters.appendChild(statusInput);
    filters.appendChild(severityInput);
    filters.appendChild(searchInput);
    filters.appendChild(apply);
    shell.appendChild(filters);

    const loading = el("div", "loading", "Loading tracked findings…");
    shell.appendChild(loading);
    findingsMount.appendChild(shell);
    const { ok, body } = await apiJson("/api/projects/" + encodeURIComponent(projectId) + "/findings" + (query ? "?" + query : ""));
    shell.removeChild(loading);
    if (!ok) {
      shell.appendChild(el("p", "err", (body && body.error) || "Tracked findings could not be loaded."));
      return;
    }
    const findings = arr(body.findings);
    if (!findings.length) {
      shell.appendChild(el("div", "empty", query ? "No tracked findings match these filters." : "No findings have been tracked yet. Findings appear here after a project run completes."));
      return;
    }
    for (const [status, label, tone] of LIFECYCLE_BUCKETS) {
      const items = findings.filter(item => item.status === status);
      const h = el("h3", "changesgroup", label + " (" + items.length + ")");
      shell.appendChild(h);
      if (!items.length) { shell.appendChild(el("p", "muted", "None in this view.")); continue; }
      const list = el("div", "list");
      for (const item of items) list.appendChild(findingRow(item));
      shell.appendChild(list);
    }
  };
  loadFindings("");
  reloadFindings = loadFindings;

  // A finding notification links here with ?finding=<id>. Rather than inventing
  // a new page, the existing project page shows that one tracked finding in full
  // detail - including the recorded lifecycle history that decided the
  // notification - above the normal tracked-findings list.
  const openFindingFromQuery = async () => {
    const wanted = new URLSearchParams(location.search).get("finding");
    if (!wanted) return;
    const detailMount = el("div"); detailMount.id = "notification-finding";
    mount.insertBefore(detailMount, findingsMount);
    const { ok, body } = await apiJson("/api/projects/" + encodeURIComponent(projectId) + "/findings/" + encodeURIComponent(wanted));
    detailMount.innerHTML = "";
    if (!ok) {
      detailMount.appendChild(el("p", "err", (body && body.error) || "That finding could not be loaded."));
      return;
    }
    const detail = el("div", "card notifdetail");
    detail.appendChild(el("p", "muted", "Opened from a notification. This is the project's own tracked record for this finding."));
    const finding = body.finding;
    const head = el("div", "runrow");
    head.appendChild(el("span", "u", finding.title || finding.id));
    const tags = el("span");
    tags.appendChild(chip(finding.severity, finding.severity === "CRITICAL" || finding.severity === "HIGH" ? "fail" : "muted"));
    tags.appendChild(chip(LIFECYCLE_LABEL[finding.status] || finding.status, LIFECYCLE_CLASS[finding.status] || "muted"));
    head.appendChild(tags);
    detail.appendChild(head);
    const meta = el("div", "muted");
    meta.appendChild(document.createTextNode(
      "First seen " + (formatTime(finding.firstSeenAt) || finding.firstSeenAt || NOT_AVAILABLE)
      + " · last seen " + (formatTime(finding.lastSeenAt) || finding.lastSeenAt || NOT_AVAILABLE)
      + " · seen in " + (finding.occurrenceCount == null ? NOT_AVAILABLE : String(finding.occurrenceCount)) + " run(s)"
      + (finding.code ? " · " + finding.code : "")
      + (finding.page ? " · " + finding.page : "")
    ));
    detail.appendChild(meta);

    // The lifecycle events the engine actually recorded, oldest first. This is
    // the evidence a resolution notification rests on, so it is shown as-is.
    const events = arr(body.history).slice().sort((a, b) => String(a.at || "").localeCompare(String(b.at || "")));
    if (events.length) {
      detail.appendChild(el("h3", "changesgroup", "Recorded lifecycle"));
      const list = el("ul", "lifecycle");
      for (const event of events) {
        const li = el("li");
        li.appendChild(el("span", "muted", formatTime(event.at) || event.at || NOT_AVAILABLE));
        li.appendChild(chip(LIFECYCLE_LABEL[event.status] || event.status, LIFECYCLE_CLASS[event.status] || "muted"));
        if (event.observed === false) li.appendChild(chip("Not observed", "warn"));
        if (event.runId) {
          const openRun = el("button", "btn secondary", "Open that run"); openRun.type = "button";
          openRun.addEventListener("click", () => openHistoricalRun(event.runId, runPanel, resultPanel));
          li.appendChild(openRun);
        }
        list.appendChild(li);
      }
      detail.appendChild(list);
    }
    const links = el("div", "links");
    links.appendChild(link("/api/projects/" + encodeURIComponent(projectId) + "/findings/" + encodeURIComponent(wanted) + "/history", "Lifecycle history"));
    const dismiss = el("button", "btn secondary", "Close"); dismiss.type = "button";
    dismiss.addEventListener("click", () => {
      detailMount.remove();
      navigate("/projects/" + encodeURIComponent(projectId));
    });
    links.appendChild(dismiss);
    detail.appendChild(links);
    detailMount.appendChild(detail);
  };
  openFindingFromQuery();

  /** Re-reads the saved project so the summary reflects the finished run. */
  const reloadSummary = async () => {
    const again = await apiJson("/api/projects/" + encodeURIComponent(projectId));
    if (!again.ok) return;
    const fresh = again.body.project;
    for (const key of ["lastRunId", "lastRunAt", "lastStatus", "lastFindingsCount", "lastCoverageStatus", "name", "url"]) {
      if (fresh[key] !== undefined) project[key] = fresh[key];
    }
    runs.length = 0;
    for (const run of arr(again.body.runs)) runs.push(run);
    findingSummaries = arr(again.body.findings);
    changeRecords = arr(again.body.changes);
    buildSummary();
    if (reloadFindings) await reloadFindings("");
    await loadSchedule();
  };
  onRunCompleted = reloadSummary;
  buildSummary();
  await loadSchedule();

  const footer = el("div", "footer");
  footer.appendChild(el("span", null, "Projects organize runs. They do not change how QA is executed."));
  mount.appendChild(footer);

  runBtn.addEventListener("click", async () => {
    clearToast();
    if (busy) return;
    busy = true;
    setBusy(true);
    try {
      const res = await fetch("/api/projects/" + encodeURIComponent(projectId) + "/runs", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) { showProjectError(toast, res.status, (data && data.error) || "Could not start the run."); setBusy(false); return; }
      activeRunId = data.run.runId;
      renderRunPanel(data.run);
      resultPanel.innerHTML = "";
      schedulePoll(400);
    } catch {
      showError("Could not reach the QA server. Is the dashboard still running?");
      setBusy(false);
    }
  });
}

/**
 * Opens an already-finished run's results. This reads the artifact the engine
 * wrote on that run — it never executes QA again.
 */
async function openHistoricalRun(runId, runPanel, resultPanel) {
  const { ok, body } = await apiJson("/api/qa/runs/" + encodeURIComponent(runId));
  if (!ok) { showError((body && body.error) || "That run is no longer available in this session."); return; }
  const run = body.run;
  renderRunPanel(run);
  await loadResult(run);
  if (resultPanel) resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------------------------------------------------------------------------
// Recent runs
// ---------------------------------------------------------------------------
async function refreshRecent() {
  const body = document.getElementById("recent-body");
  if (!body) return;
  body.innerHTML = "";
  let sessionRuns = [];
  let history = { sites: [] };
  try {
    const [runsRes, historyRes] = await Promise.all([fetch("/api/qa/runs"), fetch("/api/history")]);
    if (runsRes.ok) { const d = await runsRes.json(); sessionRuns = arr(d.runs); }
    if (historyRes.ok) history = await historyRes.json();
  } catch { /* show what we can */ }

  if (sessionRuns.length) {
    body.appendChild(el("div", "muted", "This session — full results available"));
    const ul = el("ul", "list");
    for (const run of sessionRuns) {
      const li = el("li");
      const r = el("div", "runrow");
      const left = el("div");
      left.appendChild(el("div", "u", run.url));
      const bits = [formatTime(run.startedAt) || run.startedAt];
      bits.push(run.state === "COMPLETED" ? (run.qaStatus || "COMPLETED") : run.state);
      if (run.completedAt && run.startedAt) bits.push("in " + formatMs(new Date(run.completedAt).getTime() - new Date(run.startedAt).getTime()));
      if (run.historyRunId) bits.push("persisted");
      left.appendChild(el("div", "sub", bits.join(" · ")));
      r.appendChild(left);
      const right = el("div");
      if (run.state === "COMPLETED") {
        right.appendChild(statusChip(run.qaStatus));
        const open = el("button", "btn secondary", "View results");
        open.type = "button";
        open.style.marginLeft = "8px";
        open.addEventListener("click", () => {
          activeRunId = run.runId;
          renderRunPanel(run);
          loadResult(run);
          const top = document.getElementById("result-panel");
          if (top) top.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        right.appendChild(open);
      } else {
        right.appendChild(chip(run.state, run.state === "FAILED" ? "fail" : "warn"));
        if (run.error) right.appendChild(chip(run.error.split("\n")[0].slice(0, 70), "muted"));
      }
      r.appendChild(right);
      li.appendChild(r);
      ul.appendChild(li);
    }
    body.appendChild(ul);
  }

  const persisted = [];
  for (const site of arr(history.sites)) for (const run of arr(site.runs)) persisted.push(run);
  persisted.sort((a, b) => String(b.completedAt || "").localeCompare(String(a.completedAt || "")));
  if (persisted.length) {
    const note = el("div", "muted", "Persisted history — summary snapshots only");
    note.appendChild(el("div", "muted", "Archived runs keep a compact snapshot, not the full report. Open one in the evidence explorer for its findings."));
    body.appendChild(note);
    const ul = el("ul", "list");
    for (const run of persisted.slice(0, 8)) {
      const li = el("li");
      const r = el("div", "runrow");
      const left = el("div");
      left.appendChild(el("div", "u", run.runId));
      left.appendChild(el("div", "sub", (formatTime(run.completedAt) || "unknown time") + " · " + num(run.findingCount) + " finding(s)"));
      r.appendChild(left);
      r.appendChild(link("/dashboard#/runs/" + encodeURIComponent(run.runId) + "/findings", "View evidence →"));
      li.appendChild(r);
      ul.appendChild(li);
    }
    body.appendChild(ul);
  }

  if (!sessionRuns.length && !persisted.length) body.appendChild(el("div", "empty", "No runs yet. Start one above."));
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
renderRoute();
</script>
</body>
</html>
